# Configuración que lee el Análisis Automático de SonarCloud (DECISIÓN 044).
# El Análisis Automático ignora sonar-project.properties: por eso sus exclusiones
# nunca se aplicaron y los prototipos HTML de frontend/frontend-design/ aparecían
# como bugs. Solo exclusiones acá; fuentes y tests los detecta el análisis solo.

# Artefactos generados por herramientas y prototipos de diseño — no son código nuestro.
sonar.exclusions=frontend/public/mockServiceWorker.js,frontend/dist/**,frontend/frontend-design/**

# Lo común a nginx.conf (HTTP: desarrollo, CI y el servidor de la UCC por el 80) y nginx.ucc.conf (el mismo
# contenido por el 80 y el 443): tope de subida, cabeceras de seguridad y las location. Se incluye dentro de cada
# `server` (DECISIÓN 083). docker-compose.yml lo monta en /etc/nginx/metis-comun.conf.

# H13 — DECISIÓN 050: el backend corta en 10 MB (MAX_UPLOAD_BYTES) y responde
# PARSE_FILE_TOO_LARGE. nginx tiene que dejar pasar un poco más (el cuerpo multipart suma
# cabeceras y el resto del formulario): con 10m exactos, un archivo apenas por encima del
# límite se cortaba acá durante la subida y el navegador veía un error de red.
client_max_body_size 11m;
# Por encima de eso nginx corta igual, pero responde con la estructura de error del contrato
# (api-contracts.md) en lugar de su página HTML: el frontend muestra el mismo mensaje que con
# el 400 del backend.
error_page 413 = @archivo_demasiado_grande;

location @archivo_demasiado_grande {
    default_type application/json;
    return 413 '{"error":{"codigo":"PARSE_FILE_TOO_LARGE","mensaje":"El archivo supera el límite de 10 MB."}}';
}

# H7 — 'always' para que salgan también en los errores. CSP en modo Report-Only hasta
# verificarla contra el build: el chunk de KaTeX y los estilos en línea de React podrían
# romperse con una política bloqueante.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE support
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
}

# F11 (docs/historico/planes/frontend/informe-diagnostico-ui-rota.md): sin esto, /ping caía
# en `location /` y se proxeaba al frontend (HTML/404) en vez de al
# backend real — useBackendPing mostraría "Backend no disponible" en
# producción con el backend perfectamente sano. Tiene que ir antes de
# `location /` — nginx usa la primera coincidencia de prefijo más
# específica, pero declarar el orden explícito evita ambigüedad.
location /ping {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# El Cache-Control de los estáticos lo pone frontend/nginx.conf, que es quien los sirve.
location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Servidor de la UCC con HTTPS (DECISIÓN 083, parte 2). Lo monta docker-compose.ucc-tls.yml en lugar de
# nginx.conf. El certificado y la clave no están en el repo: van en certs/ del directorio del compose en el
# servidor (ignorado por git), con estos nombres; los genera scripts/generar-cert-ucc.sh.
#
# Cómo se entra a METIS: la URL pública está publicada detrás de Cloudflare, restringida al acceso interno de la
# UCC. Cloudflare termina el TLS público y hasta ahora le hablaba a este servidor por HTTP (el 80). IT pidió exponer
# HTTPS con un certificado autofirmado en un puerto nuevo y avisarle para que repunte el proxy: el certificado no
# tiene que ser de confianza (Cloudflare en modo "Full" cifra pero no lo valida), solo existir. Por eso:
#
# - El 80 NO redirige al 443. Mientras IT no repunte el proxy, Cloudflare sigue entrando por el 80, y una
#   redirección ahí produce un bucle. Cuando el proxy ya entre por el 443, el 80 puede pasar a `return 301`.
# - Los dos puertos sirven lo mismo (metis-comun.conf).
#
# Por qué HTTPS entre Cloudflare y el servidor, y no solo en el borde público: el tramo que importa para D-UCC-03
# (la red retiene cada respuesta HTTP hasta que termina, y un stream en pausa no termina nunca) es el que cruza la
# red de la UCC; un intermediario no puede retener por contenido lo que no puede leer.

server_tokens off;

# Igual que nginx.conf: text/event-stream fuera de gzip para que el SSE llegue en vivo.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# IP real del cliente. PENDIENTE de la respuesta de IT (qué cabecera manda el proxy y desde qué rangos). Sin esto,
# todo lo que llega por Cloudflare figura con la IP del proxy: no se puede distinguir un usuario de otro en el log ni
# poner un límite de pedidos por origen. Se completa con los rangos reales y se descomenta:
#   set_real_ip_from <rango del proxy de IT / de Cloudflare>;
#   real_ip_header   CF-Connecting-IP;   # o X-Forwarded-For, según conteste IT
#   real_ip_recursive on;

server {
    listen 80;
    include /etc/nginx/metis-comun.conf;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/metis.crt;
    ssl_certificate_key /etc/nginx/certs/metis.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS no va con un certificado autofirmado: si después cambia o vence, los navegadores que lo vieron quedan sin
    # poder entrar hasta que expire el max-age. Lo pone Cloudflare en el borde público si se quiere.

    include /etc/nginx/metis-comun.conf;
}

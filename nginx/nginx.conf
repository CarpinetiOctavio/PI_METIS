# Endurecimiento (B1/B2 del plan de mejoras post-despliegue UCC, 29/10/2026): sin versión en
# la cabecera Server, cabeceras de seguridad, compresión y tope de subida por encima del del
# backend. La versión con TLS para el servidor de la UCC es nginx/nginx.ucc.conf (DECISIÓN 083); lo común a las dos
# está en nginx/metis-comun.conf.

# H7 — nginx anunciaba su versión exacta en cada respuesta.
server_tokens off;

# H11 — el bundle salía sin comprimir. text/event-stream queda fuera a propósito: comprimir el
# SSE obliga a nginx a juntar bytes antes de mandarlos, y el stream deja de llegar en vivo.
# gzip_proxied any: todo lo que sirve esta instancia llega por proxy (frontend y backend).
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

server {
    listen 80;
    include /etc/nginx/metis-comun.conf;
}

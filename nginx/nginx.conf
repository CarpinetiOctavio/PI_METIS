server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # F11 (docs/frontend/informe-diagnostico-ui-rota.md): sin esto, /ping caía
    # en `location /` y se proxeaba al frontend (HTML/404) en vez de al
    # backend real — useBackendPing mostraría "Backend no disponible" en
    # producción con el backend perfectamente sano. Tiene que ir antes de
    # `location /` — nginx usa la primera coincidencia de prefijo más
    # específica, pero declarar el orden explícito evita ambigüedad.
    location /ping {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

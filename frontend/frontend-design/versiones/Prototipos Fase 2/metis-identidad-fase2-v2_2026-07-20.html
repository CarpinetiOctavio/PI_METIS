<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METIS · Explorador de Identidad — Fase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ Chrome del explorador (neutro, fuera de tema) ============ */
:root{--nz:#1f272e;--nz-2:#2c363e;--nz-line:#3a454e;--nz-ink:#e7eaed;--nz-mut:#9aa4ad;}
*{box-sizing:border-box}
body{margin:0;background:#0f1216;color:var(--nz-ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
header.exp{position:sticky;top:0;z-index:60;background:var(--nz);border-bottom:1px solid #000;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
header.exp .brand{font-weight:700;letter-spacing:.5px}
header.exp .brand small{font-weight:400;color:var(--nz-mut);letter-spacing:0}
.exp .sp{flex:1}
.theme-tabs{display:flex;gap:6px;flex-wrap:wrap}
.theme-tabs button{border:1px solid var(--nz-line);background:var(--nz-2);color:#cfd6db;padding:6px 13px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.theme-tabs button .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.theme-tabs button.active{background:var(--nz-ink);color:var(--nz);border-color:var(--nz-ink)}
.mode-toggle{display:flex;background:var(--nz-2);border-radius:20px;padding:3px;border:1px solid var(--nz-line)}
.mode-toggle button{border:0;background:transparent;color:var(--nz-mut);padding:5px 13px;border-radius:16px;cursor:pointer;font-size:12.5px;font-weight:600}
.mode-toggle button.active{background:var(--nz-ink);color:var(--nz)}
.wrap{display:flex;gap:0;align-items:flex-start}
.canvas{flex:1;min-width:0;padding:28px;display:flex;justify-content:center}
aside.notes{width:290px;flex-shrink:0;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:#141922;border-left:1px solid #232c38;padding:18px 18px 40px}
aside.notes h4{margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--nz-mut)}
aside.notes .cn{font-size:16px;font-weight:700;margin-bottom:2px}
aside.notes .tl{color:var(--nz-mut);font-size:12px;margin-bottom:14px}
aside.notes .blk{margin-bottom:16px}
aside.notes .blk b{font-size:12px;color:#c6cdd4}
aside.notes ul{margin:6px 0 0;padding-left:15px;color:#aab3bb;font-size:12px}
aside.notes li{margin-bottom:5px}
aside.notes .mini-sw{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
aside.notes .mini-sw span{width:22px;height:22px;border-radius:4px;border:1px solid #2a2f36}

/* ============ Showcase: tokens por tema (color via vars, forma/tipo via [data-theme]) ============ */
#showcase{width:100%;max-width:1080px;background:var(--bg);color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:var(--f-body)}
#showcase h1,#showcase h2,#showcase h3,.sc-logo{font-family:var(--f-head)}
.sc-mono,.num{font-family:var(--f-mono)}
.sc-section{padding:26px 30px;border-bottom:1px solid var(--line)}
.sc-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--acc);font-weight:700;margin:0 0 10px;font-family:var(--f-body)}

/* Hero / brand */
.sc-hero{padding:0;position:relative;overflow:hidden}
.sc-hero .inner{padding:34px 30px 30px;position:relative;z-index:2}
.sc-topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.sc-logo{font-size:22px;font-weight:700;letter-spacing:.5px;color:var(--ink);display:flex;align-items:center;gap:9px}
.sc-logo .mark{width:26px;height:26px;border-radius:var(--r-sm);background:var(--acc);display:inline-flex;align-items:center;justify-content:center;color:var(--on-acc);font-size:14px;font-weight:800}
.sc-topbar .sp{flex:1}
.sc-navlink{color:var(--mut);font-size:12.5px}
.sc-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.sc-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sc-h1{font-size:34px;line-height:1.1;margin:0 0 12px;color:var(--ink);letter-spacing:-.5px;max-width:16ch}
.sc-lede{font-size:15px;color:var(--mut);margin:0 0 20px;max-width:52ch}
.sc-cta{display:flex;gap:10px}

/* Buttons */
.b{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--f-body)}
.b-pri{background:var(--acc);color:var(--on-acc)}
.b-sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.b-gho{background:transparent;color:var(--acc)}
.b-sm{padding:7px 13px;font-size:12.5px}

/* Palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surf)}
.sw .chip{height:52px}
.sw .lb{padding:6px 8px;font-size:10.5px}
.sw .lb .nm{font-weight:600;color:var(--ink)}
.sw .lb .hx{font-family:var(--f-mono);color:var(--mut);text-transform:uppercase}

/* Type specimen */
.spec .d{font-size:38px;line-height:1.05;color:var(--ink);letter-spacing:-.5px;margin:0}
.spec .s{font-size:19px;color:var(--ink);margin:12px 0 6px}
.spec p{color:var(--mut);margin:0 0 12px;max-width:64ch;font-size:14px}
.spec .n{font-family:var(--f-mono);font-size:26px;color:var(--acc);font-weight:600}

/* Components */
.comp-row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.comp-col{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.field{background:var(--surf);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 12px;color:var(--mut);font-size:13px;min-width:200px}
.chip-t{display:inline-flex;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.chip-t span{padding:6px 13px;font-size:12px;color:var(--mut)}
.chip-t span.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.ico{display:flex;gap:12px;color:var(--acc)}
.ico svg{width:24px;height:24px}

/* Applied: card / chart / table / progress */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-md);padding:18px}
.card2{background:var(--surf2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.k-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin:0 0 12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surf)}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:700;color:var(--ink);font-family:var(--f-mono)}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line-strong);font-weight:700}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
table.t td.num{font-family:var(--f-mono);color:var(--ink)}
table.t tr.sel td{background:var(--acc-soft)}
.chart{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surf2);height:150px;position:relative;overflow:hidden}
.chart svg{width:100%;height:100%;display:block}
.testrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.testrow:last-child{border-bottom:0}
.testrow .nm{font-weight:600;color:var(--ink);font-size:13px}
.testrow .st{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--acc);font-size:15px}

/* UCC blend band */
.ucc{background:var(--ucc-bg);border-top:1px solid var(--ucc-line);padding:24px 30px;color:var(--ucc-ink)}
.ucc .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ucc .lock{display:flex;align-items:center;gap:11px}
.ucc .mono-ucc{width:42px;height:42px;border-radius:6px;background:var(--ucc-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-.5px;font-family:var(--f-head)}
.ucc .lock .tx{line-height:1.25}
.ucc .lock .tx b{font-size:13px;color:var(--ucc-ink)}
.ucc .lock .tx span{font-size:11px;color:var(--ucc-mut)}
.ucc .rule{height:1px;background:var(--ucc-line);flex:1;min-width:40px}
.ucc .b-ucc{background:var(--ucc-blue);color:#fff;border:0;border-radius:var(--r-sm);padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer}
.ucc .note{font-size:11px;color:var(--ucc-mut);margin-top:12px}

.foot-note{font-size:11px;color:var(--fnt)}
.hr{height:1px;background:var(--line);margin:16px 0}

/* ===================== Tipografía / forma / fondo por tema ===================== */
#showcase[data-theme="editorial"]{--f-head:'Fraunces',Georgia,serif;--f-body:'Inter',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:4px;--r-md:6px}
#showcase[data-theme="editorial"] .sc-hero{background:
  radial-gradient(150% 100% at 50% -20%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 55%),
  repeating-linear-gradient(0deg, transparent 0 27px, color-mix(in srgb,var(--line) 60%,transparent) 27px 28px),
  var(--bg);}
#showcase[data-theme="editorial"] .sc-hero .inner{border-bottom:3px double var(--line-strong)}
#showcase[data-theme="editorial"] .sc-hero .sc-eyebrow,#showcase[data-theme="editorial"] .sc-section .sc-eyebrow{border-left:3px solid var(--acc);padding-left:9px}
#showcase[data-theme="editorial"] .sc-h1{font-weight:600;position:relative;display:inline-block}
#showcase[data-theme="editorial"] .sc-h1::after{content:'';position:absolute;left:0;bottom:-9px;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:edraw 1.1s .35s forwards cubic-bezier(.2,.7,.2,1)}
@keyframes edraw{to{width:100%}}
#showcase[data-theme="editorial"] .kpi .v{font-family:var(--f-head);font-weight:600;font-size:27px}
#showcase[data-theme="editorial"] .spec .n{color:var(--acc)}
#showcase[data-theme="editorial"][data-mode="dark"] .sc-hero{background:
  radial-gradient(150% 100% at 50% -10%, color-mix(in srgb,var(--acc) 16%,transparent), transparent 50%),
  radial-gradient(120% 90% at 100% 120%, color-mix(in srgb,var(--acc2) 13%,transparent), transparent 55%),
  repeating-linear-gradient(0deg, transparent 0 27px, color-mix(in srgb,var(--line) 75%,transparent) 27px 28px),
  var(--bg);}
#showcase[data-theme="editorial"][data-mode="dark"] .card{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc2) 16%,transparent)}
#showcase[data-theme="editorial"][data-mode="dark"] .sc-logo .mark{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc2) 40%,transparent),0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}

#showcase[data-theme="agua"]{--f-head:'Space Grotesk',sans-serif;--f-body:'Inter',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:10px;--r-md:16px}
#showcase[data-theme="agua"] .sc-hero{background:radial-gradient(120% 120% at 0% 0%,var(--acc-soft),transparent 55%),var(--bg)}
#showcase[data-theme="agua"] .sc-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--acc2) 22%,transparent) 50%,transparent 70%);background-size:300% 100%;animation:flow 9s linear infinite;z-index:1;opacity:.5}
@keyframes flow{0%{background-position:120% 0}100%{background-position:-120% 0}}

#showcase[data-theme="academico"]{--f-head:'Inter',sans-serif;--f-body:'Inter',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:8px;--r-md:12px}
#showcase[data-theme="academico"] .sc-h1{font-weight:700;letter-spacing:-.8px}
#showcase[data-theme="academico"] .sc-hero{background:
  radial-gradient(120% 95% at 100% -20%, var(--acc-soft), transparent 55%),
  radial-gradient(closest-side at 8px 8px, color-mix(in srgb,var(--line-strong) 55%,transparent) 1px, transparent 1.6px) 0 0/22px 22px,
  var(--bg);}
#showcase[data-theme="academico"] .sc-hero .inner{padding:44px 30px 40px 46px;position:relative}
#showcase[data-theme="academico"] .sc-hero .inner::before{content:'';position:absolute;left:24px;top:44px;bottom:40px;width:4px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
#showcase[data-theme="academico"] .sc-hero .sc-eyebrow,#showcase[data-theme="academico"] .sc-section .sc-eyebrow{display:inline-flex;align-items:center;gap:8px}
#showcase[data-theme="academico"] .sc-hero .sc-eyebrow::before,#showcase[data-theme="academico"] .sc-section .sc-eyebrow::before{content:'';width:18px;height:2px;background:var(--acc)}
#showcase[data-theme="academico"] .sc-section{animation:afade .55s both}
@keyframes afade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#showcase[data-theme="academico"] .card{box-shadow:0 8px 22px -14px color-mix(in srgb,var(--ink) 45%,transparent)}
#showcase[data-theme="academico"][data-mode="dark"] .sc-hero{background:
  radial-gradient(120% 95% at 100% -20%, color-mix(in srgb,var(--acc) 22%,transparent), transparent 55%),
  radial-gradient(90% 80% at 0% 120%, color-mix(in srgb,var(--acc2) 13%,transparent), transparent 55%),
  radial-gradient(closest-side at 8px 8px, color-mix(in srgb,var(--line-strong) 42%,transparent) 1px, transparent 1.6px) 0 0/22px 22px,
  var(--bg);}
#showcase[data-theme="academico"][data-mode="dark"] .card{box-shadow:0 10px 26px -16px #000, inset 0 1px 0 color-mix(in srgb,#fff 7%,transparent)}
#showcase[data-theme="academico"][data-mode="dark"] .kpi{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,var(--surf)),var(--surf))}

#showcase[data-theme="instrumento"]{--f-head:'JetBrains Mono',monospace;--f-body:'Inter',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:3px;--r-md:4px}
#showcase[data-theme="instrumento"] .sc-hero{background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;background-color:var(--bg)}
#showcase[data-theme="instrumento"] .sc-hero::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scan 3.4s linear infinite;z-index:3;opacity:.8}
@keyframes scan{0%{top:0}100%{top:100%}}
#showcase[data-theme="instrumento"] .sc-logo .mark{clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
#showcase[data-theme="instrumento"] .sc-eyebrow::before{content:'▸ '}
.cursor{display:inline-block;width:8px;height:1.05em;background:var(--acc);margin-left:3px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<!--
  METIS · Explorador de Identidad Visual — Fase 2
  4 direcciones (Editorial, Hidrología, Académico, Instrumento) × claro/oscuro.
  Style tile + pantallas aplicadas + banda de blend institucional UCC.
  Azul UCC representativo (#00378A) — CONFIRMAR contra el manual de marca oficial de la UCC.
  Documento de justificaciones: metis-identidad-fase2.md
  v1 (20/07): 4 direcciones × claro/oscuro. Snapshot en /versiones/metis-identidad-fase2-v1_2026-07-20.html
  v2 (20/07): Editorial y Académico enriquecidos — paletas oscuras con más profundidad y tinte,
     texturas de fondo (papel rayado / retícula de puntos), franja de acento, motion propio
     (regla claret+dorada que se dibuja en Editorial; fade-up + elevación + spine azul→verde en Académico).
-->
<header class="exp">
  <div class="brand">METIS <small>· Identidad Visual — Fase 2 · v2</small></div>
  <div class="sp"></div>
  <div class="theme-tabs" id="themeTabs"></div>
  <div class="mode-toggle" id="modeToggle">
    <button data-mode="light" class="active">Claro</button>
    <button data-mode="dark">Oscuro</button>
  </div>
</header>

<div class="wrap">
  <div class="canvas">
    <div id="showcase" data-theme="agua" data-mode="light"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ============ Tokens de color por tema y modo ============ */
const THEMES = {
  editorial:{
    name:'Editorial de datos', sw:'#8A2B3A',
    tagline:'Tipografía protagonista, el número como titular.',
    concept:'Estética de publicación científica moderna: serif de display, mucho aire, un acento sobrio y los números en monoespaciada como si fueran cifras de portada. Legible en tablas densas, serio sin ser frío.',
    motion:'Editorial con carácter: una regla acento se dibuja bajo el titular, papel rayado sutil de fondo, y las cifras van en serif de gran tamaño como en una portada. El acento claret se acompaña de un dorado para el gesto de "manuscrito ilustrado".',
    ico:'serif',
    light:{bg:'#FBF9F4',surf:'#FFFFFF',surf2:'#F0ECE3',ink:'#1A1712',mut:'#6B655B',fnt:'#A69F92',line:'#E7E1D5',lineStrong:'#D2C9B8',acc:'#8A2B3A',accSoft:'#F2DCDF',onAcc:'#FFFFFF',acc2:'#9A6B1E',ok:'#3F6B52',warn:'#9A7B2E',crit:'#A33A3A'},
    dark:{bg:'#15110D',surf:'#1E1913',surf2:'#271F16',ink:'#F4EFE4',mut:'#B4AA97',fnt:'#79705F',line:'#33291D',lineStrong:'#4A3D28',acc:'#E4949C',accSoft:'#3A2822',onAcc:'#15110D',acc2:'#CBA25E',ok:'#84B693',warn:'#D9B96C',crit:'#E88C8C'}
  },
  agua:{
    name:'Hidrología / agua', sw:'#0E7C93',
    tagline:'Caudal, flujo y transparencia — el dominio hecho identidad.',
    concept:'Azules y verdeazulados con gradientes suaves y movimiento orgánico que evoca el agua. Formas redondeadas y amables. Conecta de inmediato con el objeto del proyecto (eventos hidrológicos) sin caer en lo literal.',
    motion:'Gradiente que fluye lento en el hero, transiciones líquidas, barras que se llenan como una crecida.',
    ico:'round',
    light:{bg:'#F1F8FB',surf:'#FFFFFF',surf2:'#E4F0F5',ink:'#0F2830',mut:'#4C6672',fnt:'#9BB2BB',line:'#D0E2E9',lineStrong:'#B4D2DD',acc:'#0E7C93',accSoft:'#D3EDF3',onAcc:'#FFFFFF',acc2:'#3BB6CE',ok:'#2E8B7A',warn:'#B9852E',crit:'#C2503F'},
    dark:{bg:'#06181E',surf:'#0D2730',surf2:'#123640',ink:'#DCF0F5',mut:'#7FA3AE',fnt:'#4C6C77',line:'#1B4350',lineStrong:'#295764',acc:'#35C6DE',accSoft:'#0F3742',onAcc:'#06181E',acc2:'#6FE0EF',ok:'#4FC7A8',warn:'#D9B064',crit:'#E8776A'}
  },
  academico:{
    name:'Académico moderno', sw:'#35618E',
    tagline:'Limpio, confiable, con aire. Apto para tribunal y aula.',
    concept:'Neutros suaves, un azul académico sereno y mucho espacio en blanco. Grotesca humanista, jerarquía clara. Transmite rigor y confianza institucional sin rigidez — el registro justo para una defensa de grado y el uso docente.',
    motion:'Depth serena: lámina con textura de puntos muy sutil, una franja de acento (azul→verde) al costado del hero, secciones que aparecen de abajo hacia arriba y tarjetas con elevación. Sereno pero con relieve — nunca plano, sobre todo en oscuro.',
    ico:'line',
    light:{bg:'#F4F7FA',surf:'#FFFFFF',surf2:'#E9EFF4',ink:'#1E262D',mut:'#5F6C77',fnt:'#9EA9B3',line:'#DDE4EB',lineStrong:'#C6D0DA',acc:'#2F6191',accSoft:'#DBE8F4',onAcc:'#FFFFFF',acc2:'#2C8A6E',ok:'#2E7D5B',warn:'#9A7A2E',crit:'#B0453F'},
    dark:{bg:'#0F141B',surf:'#161D27',surf2:'#1D2632',ink:'#E9EFF5',mut:'#8B99A7',fnt:'#54606D',line:'#273240',lineStrong:'#3A4859',acc:'#72A6E2',accSoft:'#152538',onAcc:'#0F141B',acc2:'#5FC4A4',ok:'#5BB98C',warn:'#CBAB60',crit:'#DB7A72'}
  },
  instrumento:{
    name:'Instrumento de precisión', sw:'#0E7490',
    tagline:'Motor de cálculo a la vista. Cero parecido con Excel.',
    concept:'Alto contraste, retícula técnica, monoespaciada en los títulos y un acento de señal que resalta el dato vivo. Se siente como un instrumento de medición serio. Brilla en oscuro; el modo claro conserva la precisión.',
    motion:'Línea de escaneo, cursor que parpadea, contadores que suben hasta clavar el estadístico. Feedback de máquina.',
    ico:'tech',
    light:{bg:'#F3F6F8',surf:'#FFFFFF',surf2:'#E9EEF2',ink:'#0B0E12',mut:'#5B6672',fnt:'#9AA5B1',line:'#DEE5EB',lineStrong:'#C6D0D8',acc:'#0E7490',accSoft:'#D4EEF3',onAcc:'#FFFFFF',acc2:'#4D7C0F',ok:'#128A4E',warn:'#B5791A',crit:'#C24444'},
    dark:{bg:'#0B0E12',surf:'#131922',surf2:'#1A2029',ink:'#E6EDF3',mut:'#8A97A6',fnt:'#566270',line:'#232C38',lineStrong:'#33404E',acc:'#22D3EE',accSoft:'#0E2A33',onAcc:'#04252B',acc2:'#B9F227',ok:'#35D07A',warn:'#F4B740',crit:'#FF6A6A'}
  }
};
const UCC_BLUE='#00378A';
const ORDER=['editorial','agua','academico','instrumento'];
let state={theme:'agua',mode:'light'};

/* iconos SVG por familia (line/round/tech/serif comparten set, cambia el trazo) */
function icons(kind){
  const sw=kind==='tech'?2.2:kind==='round'?1.6:1.9;
  const cap=kind==='round'?'round':'square';
  const P=`fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="${cap}" stroke-linejoin="${cap==='round'?'round':'miter'}"`;
  return `
   <svg viewBox="0 0 24 24">${'<path '+P+' d="M4 20V8M10 20V4M16 20v-8M22 20H2"/>'}</svg>
   <svg viewBox="0 0 24 24"><path ${P} d="M3 17l5-5 4 3 8-9"/><path ${P} d="M21 6v5h-5"/></svg>
   <svg viewBox="0 0 24 24"><path ${P} d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9" ${P}/></svg>
   <svg viewBox="0 0 24 24"><path ${P} d="M4 5h16M4 12h16M4 19h10"/></svg>
   <svg viewBox="0 0 24 24"><path ${P} d="M3 12a9 9 0 1018 0 9 9 0 10-18 0z"/><path ${P} d="M8 13c1.5 2 6.5 2 8 0"/></svg>`;
}
const areaChart=(fillOpacity=0.18)=>`<div class="chart"><svg viewBox="0 0 320 150" preserveAspectRatio="none">
  <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity="${fillOpacity+0.14}"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  <path d="M0,120 L30,95 60,105 90,60 120,78 150,40 180,66 210,30 240,52 270,24 300,44 320,36 L320,150 L0,150 Z" fill="url(#g)"/>
  <path d="M0,120 L30,95 60,105 90,60 120,78 150,40 180,66 210,30 240,52 270,24 300,44 320,36" fill="none" stroke="var(--acc)" stroke-width="2.2"/>
  <g>${[95,105,60,78,40,66,30,52,24,44].map((y,i)=>`<circle cx="${30+i*30}" cy="${y}" r="2.6" fill="var(--surf)" stroke="var(--acc)" stroke-width="2"/>`).join('')}</g>
</svg></div>`;

function tk(){return THEMES[state.theme][state.mode];}

function renderShowcase(){
  const T=THEMES[state.theme], c=tk();
  const sc=document.getElementById('showcase');
  sc.setAttribute('data-theme',state.theme);
  sc.setAttribute('data-mode',state.mode);
  const set=(k,v)=>sc.style.setProperty(k,v);
  set('--bg',c.bg);set('--surf',c.surf);set('--surf2',c.surf2);set('--ink',c.ink);set('--mut',c.mut);set('--fnt',c.fnt);
  set('--line',c.line);set('--line-strong',c.lineStrong);set('--acc',c.acc);set('--acc-soft',c.accSoft);set('--on-acc',c.onAcc);
  set('--acc2',c.acc2);set('--ok',c.ok);set('--warn',c.warn);set('--crit',c.crit);
  // UCC blend: en claro fondo blanco/azul; en oscuro panel oscuro con acento azul UCC, mismo espíritu minimalista
  const uccBg = state.mode==='light' ? '#FFFFFF' : '#0E1420';
  const uccInk = state.mode==='light' ? '#0B2545' : '#DCE6F5';
  const uccMut = state.mode==='light' ? '#5B7091' : '#8497B5';
  const uccLine= state.mode==='light' ? '#DCE6F5' : '#20304A';
  set('--ucc-bg',uccBg);set('--ucc-ink',uccInk);set('--ucc-mut',uccMut);set('--ucc-line',uccLine);set('--ucc-blue',UCC_BLUE);

  const palette=[['bg','Fondo',c.bg],['surf','Superficie',c.surf],['ink','Tinta',c.ink],['mut','Texto tenue',c.mut],['line','Bordes',c.line],['acc','Acento',c.acc],['acc2','Acento 2',c.acc2],['ok','OK',c.ok],['warn','Warning',c.warn],['crit','Crítico',c.crit]];

  sc.innerHTML = `
  <!-- HERO / BRAND -->
  <div class="sc-hero"><div class="inner">
    <div class="sc-topbar">
      <span class="sc-logo"><span class="mark">M</span>METIS</span>
      <span class="sp"></span>
      <span class="sc-navlink">Nuevo análisis</span><span class="sc-navlink">Historial</span>
      <span class="sc-badge">Docencia</span>
    </div>
    <p class="sc-eyebrow">Análisis de frecuencia de eventos extremos${state.theme==='instrumento'?'<span class="cursor"></span>':''}</p>
    <h1 class="sc-h1">Del dato hidrológico a la decisión de diseño.</h1>
    <p class="sc-lede">${T.concept}</p>
    <div class="sc-cta"><span class="b b-pri">Cargar serie ▸</span><span class="b b-sec">Ver ejemplo</span></div>
  </div></div>

  <!-- PALETA -->
  <div class="sc-section">
    <p class="sc-eyebrow">Paleta · ${state.mode==='light'?'modo claro':'modo oscuro'}</p>
    <div class="pal">${palette.map(p=>`<div class="sw"><div class="chip" style="background:${p[2]}"></div><div class="lb"><div class="nm">${p[1]}</div><div class="hx">${p[2]}</div></div></div>`).join('')}</div>
  </div>

  <!-- TIPOGRAFÍA -->
  <div class="sc-section spec">
    <p class="sc-eyebrow">Tipografía</p>
    <p class="d">Homogeneidad y tendencia</p>
    <div class="s">Un titular serio, cuerpo legible, cifras que se leen como datos.</div>
    <p>El sistema estadístico presenta resultados densos: veredictos, estadísticos y valores críticos. La tipografía debe sostener tablas largas sin fatigar y darle jerarquía al número.</p>
    <span class="n">Q₁₀₀ = 312.7 m³/s</span>
  </div>

  <!-- COMPONENTES -->
  <div class="sc-section">
    <p class="sc-eyebrow">Componentes</p>
    <div class="comp-row">
      <div class="comp-col"><span class="b b-pri">Ejecutar ▸</span><span class="b b-sec">Exportar PDF</span><span class="b b-gho">Ver detalle</span></div>
      <div class="comp-col"><span class="pill ok">aprobada</span><span class="pill warn">warning</span><span class="pill crit">crítico</span></div>
      <div class="comp-col"><span class="field">serie_caudal.csv</span><span class="chip-t"><span class="on">Paso a paso</span><span>Experto</span></span></div>
      <div class="comp-col"><div class="ico">${icons(T.ico)}</div><span class="foot-note">Iconografía · trazo ${T.ico}</span></div>
    </div>
  </div>

  <!-- APLICADO: ANÁLISIS EN VIVO -->
  <div class="sc-section">
    <p class="sc-eyebrow">Aplicado · análisis en vivo</p>
    <div class="grid2">
      <div class="card">
        <div class="k-t">Etapa 1 · en ejecución</div>
        <div class="prog" style="margin-bottom:14px"><i data-fill style="width:0"></i></div>
        <div class="testrow"><span class="nm">Anderson</span><span class="pill ok" style="margin-left:auto">ok</span><span class="st num" data-count data-target="0.23" data-dec="2">0.00</span></div>
        <div class="testrow"><span class="nm">Helmert</span><span class="pill ok" style="margin-left:auto">ok</span><span class="st num" data-count data-target="2.10" data-dec="2">0.00</span></div>
        <div class="testrow"><span class="nm">Cramer</span><span class="pill warn" style="margin-left:auto">calc.</span><span class="st num" data-count data-target="1.14" data-dec="2">0.00</span></div>
      </div>
      <div class="card">
        <div class="k-t">Serie temporal</div>
        ${areaChart()}
        <div style="display:flex;gap:10px;margin-top:12px">
          <div class="kpi" style="flex:1"><div class="l">media</div><div class="v">142.5</div></div>
          <div class="kpi" style="flex:1"><div class="l">CV</div><div class="v">0.267</div></div>
          <div class="kpi" style="flex:1"><div class="l">n</div><div class="v">40</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- APLICADO: RANKING -->
  <div class="sc-section">
    <p class="sc-eyebrow">Aplicado · ranking de distribuciones (Etapa 2)</p>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="t"><thead><tr><th>#</th><th>Distribución</th><th>Método</th><th>EEA</th><th>Estado</th></tr></thead><tbody>
        <tr class="sel"><td class="num">1</td><td>Gumbel</td><td>Momentos</td><td class="num">34.5</td><td><span class="pill ok">elegida</span></td></tr>
        <tr><td class="num">2</td><td>GVE</td><td>Momentos</td><td class="num">35.1</td><td><span class="b b-gho b-sm">elegir</span></td></tr>
        <tr><td class="num">3</td><td>Gamma 2p</td><td>MV</td><td class="num">36.2</td><td><span class="b b-gho b-sm">elegir</span></td></tr>
      </tbody></table>
    </div>
  </div>

  <!-- UCC BLEND -->
  <div class="ucc">
    <p class="sc-eyebrow" style="color:var(--ucc-blue)">Sección institucional · blend UCC</p>
    <div class="row">
      <div class="lock"><span class="mono-ucc">UCC</span><div class="tx"><b>Universidad Católica de Córdoba</b><br><span>Facultad de Ingeniería · Proyecto Integrador</span></div></div>
      <div class="rule"></div>
      <button class="b-ucc">Acceso institucional</button>
    </div>
    <p class="note">En las secciones con logo UCC la identidad de METIS hace un blend hacia el blanco/azul minimalista institucional — señala la relación con la UCC sin que la marca universitaria desplace a la de METIS. Azul UCC representativo (${UCC_BLUE}), a confirmar contra el manual de marca oficial.</p>
  </div>`;

  animate();
  buildTabs();
  renderNotes();
}

function animate(){
  const root=document.getElementById('showcase');
  root.querySelectorAll('[data-count]').forEach((elm,i)=>{
    const target=parseFloat(elm.dataset.target),dec=parseInt(elm.dataset.dec||'2'),dur=1000+i*140,start=performance.now()+i*130;
    function tick(now){let p=(now-start)/dur;if(p<0)p=0;if(p>1)p=1;const e=1-Math.pow(1-p,3);elm.textContent=(target*e).toFixed(dec);if(p<1)requestAnimationFrame(tick);}
    requestAnimationFrame(tick);
  });
  root.querySelectorAll('[data-fill]').forEach(bar=>{bar.style.width='0';setTimeout(()=>bar.style.width='72%',80);});
}

function buildTabs(){
  document.getElementById('themeTabs').innerHTML=ORDER.map(k=>`<button data-theme="${k}" class="${k===state.theme?'active':''}"><span class="sw" style="background:${THEMES[k].sw}"></span>${THEMES[k].name}</button>`).join('');
  document.querySelectorAll('#themeTabs button').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;renderShowcase();});
}
function renderNotes(){
  const T=THEMES[state.theme],c=tk();
  const swatches=[c.acc,c.acc2,c.ink,c.surf,c.ok,c.warn,c.crit];
  document.getElementById('notes').innerHTML=`
    <h4>Dirección</h4>
    <div class="cn">${T.name}</div>
    <div class="tl">${T.tagline}</div>
    <div class="mini-sw">${swatches.map(s=>`<span style="background:${s}"></span>`).join('')}</div>
    <div class="blk" style="margin-top:16px"><b>Concepto</b><ul><li>${T.concept}</li></ul></div>
    <div class="blk"><b>Movimiento</b><ul><li>${T.motion}</li></ul></div>
    <div class="blk"><b>Blend UCC</b><ul><li>Identidad propia; en secciones con logo UCC vira a blanco/azul institucional minimalista. La UCC se lee como relacionada, no como dueña del producto.</li></ul></div>
    <div class="blk"><b>Cómo leer esto</b><ul><li>Cambiá de tema y de claro/oscuro arriba. Todo (paleta, tipografía, componentes, gráficos, animación) se re-tokeniza en vivo.</li><li>Justificaciones completas en <span style="color:#c6cdd4">metis-identidad-fase2.md</span>.</li></ul></div>`;
}
document.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{
  state.mode=b.dataset.mode;
  document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));
  renderShowcase();
});
renderShowcase();
</script>
</body>
</html>

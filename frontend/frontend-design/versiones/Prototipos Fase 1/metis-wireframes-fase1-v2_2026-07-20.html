<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METIS · Explorador de Wireframes — Fase 1</title>
<style>
  :root{
    --canvas:#e9eaec;--surface:#ffffff;--line:#c7ccd1;--line-strong:#9aa1a8;
    --ink:#2c3136;--muted:#7b828a;--faint:#aeb4ba;--fill:#eef0f2;--fill-2:#e2e5e8;
    --sel:#3f5566;--sel-soft:#dbe4ea;--warn:#8a7b3a;--warn-soft:#efe9d2;--crit:#8a4a4a;--crit-soft:#efdcdc;--ok:#4a6b52;--ok-soft:#dde9e0;
    --radius:6px;--mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.45}
  /* ---------- Chrome del explorador ---------- */
  header.explorer{position:sticky;top:0;z-index:50;background:#1f272e;color:#e7eaed;display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid #000}
  header.explorer .brand{font-weight:700;letter-spacing:.5px}
  header.explorer .brand small{font-weight:400;color:#9aa4ad;letter-spacing:0}
  header.explorer .spacer{flex:1}
  .mode-toggle{display:flex;background:#2c363e;border-radius:20px;padding:3px;border:1px solid #3a454e}
  .mode-toggle button{border:0;background:transparent;color:#aeb8c0;padding:5px 14px;border-radius:16px;cursor:pointer;font-size:13px;font-weight:600}
  .mode-toggle button.active{background:#e7eaed;color:#1f272e}
  .exp-btn{border:1px solid #3a454e;background:#2c363e;color:#cfd6db;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .exp-btn.on{background:#e7eaed;color:#1f272e}
  .layout{display:flex;min-height:calc(100vh - 49px)}
  nav.flow{width:210px;flex-shrink:0;background:#f4f5f7;border-right:1px solid var(--line);padding:14px 0}
  nav.flow .grp{padding:6px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin-top:8px}
  nav.flow a{display:flex;align-items:center;gap:9px;padding:9px 18px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:13.5px}
  nav.flow a .n{width:20px;height:20px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0}
  nav.flow a:hover{background:#eaecef}
  nav.flow a.active{background:#e4e8eb;border-left-color:var(--sel);font-weight:600}
  nav.flow a.active .n{border-color:var(--sel);color:var(--sel)}
  nav.flow a.locked{opacity:.4}
  nav.flow a.locked::after{content:'docencia';margin-left:auto;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
  main.stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .stage-top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px}
  .stage-top h2{margin:0 0 3px;font-size:16px}
  .stage-top p{margin:0;color:var(--muted);font-size:12.5px}
  .variant-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .variant-tabs button{border:1px solid var(--line);background:var(--fill);color:var(--muted);padding:5px 13px;border-radius:16px;cursor:pointer;font-size:12.5px;font-weight:600}
  .variant-tabs button.active{background:var(--sel);border-color:var(--sel);color:#fff}
  .canvas-wrap{flex:1;overflow:auto;padding:26px;display:flex;gap:22px;align-items:flex-start}
  .device{flex:1;min-width:0;max-width:1000px;margin:0 auto}
  .frame{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.07)}
  .notes{width:270px;flex-shrink:0;background:#fbfbfc;border:1px dashed var(--line-strong);border-radius:8px;padding:15px 16px;font-size:12.5px;color:#4c545b;position:sticky;top:26px}
  .notes h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .notes .vname{font-weight:700;color:var(--ink);font-size:13px;margin-bottom:6px}
  .notes ul{margin:8px 0 0;padding-left:16px}
  .notes li{margin-bottom:5px}
  .notes.hidden{display:none}
  /* ---------- Primitivas de wireframe ---------- */
  .app{font-size:13px}
  .app-bar{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:#fafbfc}
  .app-bar .logo{font-weight:700;letter-spacing:1px;color:var(--ink)}
  .app-bar .logo .dot{color:var(--sel)}
  .app-bar .sp{flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:14px;font-size:11.5px;font-weight:600;border:1px solid}
  .badge.doc{background:var(--sel-soft);border-color:#b9cad6;color:var(--sel)}
  .badge.anon{background:var(--fill-2);border-color:var(--line);color:var(--muted)}
  .badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--fill-2);border:1px solid var(--line)}
  .navlink{color:var(--muted);font-size:12.5px}
  .pad{padding:22px 26px}
  .pad-lg{padding:30px 34px}
  h3.wf{margin:0 0 4px;font-size:17px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .row{display:flex;gap:16px}
  .col{flex:1;min-width:0}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface)}
  .card.soft{background:#fafbfc}
  .card-t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:700}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .input{border:1px solid var(--line);border-radius:5px;background:#fff;height:34px;display:flex;align-items:center;padding:0 10px;color:var(--faint);font-size:12.5px}
  .input.sel{border-color:var(--sel);color:var(--ink)}
  .dropzone{border:2px dashed var(--line-strong);border-radius:8px;background:#fafbfc;padding:26px;text-align:center;color:var(--muted)}
  .dropzone .ic{font-size:26px;color:var(--faint)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--muted);background:#fff;cursor:default}
  .chip.sel{border-color:var(--sel);background:var(--sel-soft);color:var(--sel);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg span{padding:6px 14px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
  .seg span:last-child{border-right:0}
  .seg span.sel{background:var(--sel);color:#fff;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:default}
  .btn.pri{background:var(--sel);border-color:var(--sel);color:#fff}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.gho{background:transparent;color:var(--muted)}
  .ph{background:repeating-linear-gradient(45deg,#f0f2f4,#f0f2f4 7px,#e8ebee 7px,#e8ebee 14px);border-radius:5px;border:1px solid var(--line)}
  .graph{border:1px solid var(--line);border-radius:6px;background:#fcfcfd;position:relative;overflow:hidden}
  .graph .axis{position:absolute;background:var(--faint)}
  .graph svg{display:block;width:100%;height:100%}
  .bars{display:flex;align-items:flex-end;gap:5px;height:100%;padding:10px}
  .bars i{flex:1;background:var(--fill-2);border-top:2px solid var(--line-strong)}
  table.wf{width:100%;border-collapse:collapse;font-size:12.5px}
  table.wf th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line-strong);font-weight:700}
  table.wf td{padding:9px 10px;border-bottom:1px solid var(--fill-2);color:var(--ink)}
  table.wf tr.sel td{background:var(--sel-soft)}
  .pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.crit{background:var(--crit-soft);color:var(--crit)}
  .pill.wait{background:var(--fill-2);color:var(--muted)}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .node{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);background:#fff;flex-shrink:0}
  .step.done .node{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .step.active .node{background:var(--sel);border-color:var(--sel);color:#fff}
  .step .line{width:2px;background:var(--line);flex:1;margin:2px 0 0 12px}
  .progress{height:8px;background:var(--fill-2);border-radius:5px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--sel);border-radius:5px}
  .console{background:#20272d;color:#cdd6de;font-family:var(--mono);font-size:12px;border-radius:6px;padding:14px 16px;line-height:1.7}
  .console .t{color:#6f7d89}.console .g{color:#8bb59a}.console .y{color:#c9b878}.console .r{color:#c98d8d}.console .cur{color:#cdd6de}
  .kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fafbfc}
  .kpi .v{font-size:20px;font-weight:700}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .banner{border:1px solid var(--line);border-radius:6px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:12.5px}
  .banner.warn{background:var(--warn-soft);border-color:#d8ceac;color:var(--warn)}
  .banner.crit{background:var(--crit-soft);border-color:#dbbfbf;color:var(--crit)}
  .banner.info{background:var(--sel-soft);border-color:#b9cad6;color:var(--sel)}
  .banner .ic{font-weight:800}
  .modal-scrim{background:rgba(30,36,42,.32);padding:26px;display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;border:1px solid var(--line-strong);border-radius:10px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2);overflow:hidden}
  .muted{color:var(--muted)}.mono{font-family:var(--mono)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tag-anon{display:inline-block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:1px 6px}
  .foot-note{font-size:11px;color:var(--faint);margin-top:6px}
  .hr{height:1px;background:var(--fill-2);margin:16px 0}
  .stack>*+*{margin-top:10px}
</style>
</head>
<body>
<!--
  METIS · Explorador de Wireframes — Fase 1
  v1 (2026-07-20): 25 variantes iniciales. Snapshot en /versiones/metis-wireframes-fase1-v1_2026-07-20.html
  v2 (2026-07-20): +5 variantes mezcla pedidas por Kevin → total 30.
    · Config G      — hero + acordeón (2 opciones) + selector de etapa siempre visible (mezcla A+E)
    · Stream G      — barras de B + índice de etapa (anillo) y pasos (puntos) + contador que sube al resultado
    · ResultadosE1 E— resumen/veredictos de A sobre el tablero de gráficos de C
    · Ranking D     — tarjetas de C con toggle año calendario/hidrológico por tarjeta
    · Eventos C     — variante B + slider sincronizado con los botones de período
-->
<header class="explorer">
  <div class="brand">METIS <small>· Explorador de Wireframes — Fase 1 · v2</small></div>
  <div class="spacer"></div>
  <span style="font-size:12px;color:#9aa4ad">Modo de la app:</span>
  <div class="mode-toggle" id="modeToggle">
    <button data-mode="doc" class="active">Docencia</button>
    <button data-mode="anon">Anónimo</button>
  </div>
  <button class="exp-btn on" id="notesBtn">Notas de diseño</button>
</header>

<div class="layout">
  <nav class="flow" id="flowNav"></nav>
  <main class="stage">
    <div class="stage-top">
      <h2 id="scTitle"></h2>
      <p id="scDesc"></p>
      <div class="variant-tabs" id="variantTabs"></div>
    </div>
    <div class="canvas-wrap">
      <div class="device"><div class="frame" id="frame"></div></div>
      <aside class="notes" id="notes"></aside>
    </div>
  </main>
</div>

<script>
/* ============================================================
   Helpers de wireframe (mid-fi, sin identidad visual)
   ============================================================ */
const el = (m)=>`<span class="badge ${m==='doc'?'doc':'anon'}">${m==='doc'?'Docencia · guardado activo':'Anónimo · sin guardado'}</span>`;
function appBar(m,{nav=true}={}){
  return `<div class="app-bar">
    <span class="logo">METIS<span class="dot">.</span></span>
    ${nav?`<span class="sp"></span>
      <span class="navlink">Nuevo análisis</span>
      ${m==='doc'?`<span class="navlink">Historial</span>`:``}
      <span class="sp"></span>`:`<span class="sp"></span>`}
    ${el(m)}
    ${m==='doc'?`<div class="avatar"></div>`:`<span class="btn sm gho">Crear cuenta</span>`}
  </div>`;
}
const graphBars=(n=12,h=120)=>{let b='';for(let i=0;i<n;i++){b+=`<i style="height:${25+Math.round(Math.abs(Math.sin(i*1.3))*70)}%"></i>`}return `<div class="graph" style="height:${h}px"><div class="bars">${b}</div></div>`};
const graphLine=(h=120)=>`<div class="graph" style="height:${h}px"><svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="0,95 40,70 80,82 120,45 160,60 200,30 240,52 300,20" fill="none" stroke="#9aa1a8" stroke-width="2"/><polyline points="0,110 300,110" stroke="#c7ccd1" stroke-width="1"/><line x1="2" y1="6" x2="2" y2="112" stroke="#c7ccd1"/></svg></div>`;
const graphLine2=(h=120)=>`<div class="graph" style="height:${h}px"><svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="0,60 40,40 80,55 120,72 160,35 200,66 240,28 300,48" fill="none" stroke="#9aa1a8" stroke-width="2" stroke-dasharray="3 2"/><polyline points="0,110 300,110" stroke="#c7ccd1" stroke-width="1"/><line x1="2" y1="6" x2="2" y2="112" stroke="#c7ccd1"/></svg></div>`;
const ph=(h)=>`<div class="ph" style="height:${h}px"></div>`;
function yearTabs(){return `<div class="seg" style="font-size:11px"><span class="sel">Año calendario</span><span>Año hidrológico</span></div>`}

/* ============================================================
   Definición de pantallas y variantes
   ============================================================ */
const SCREENS = {

/* ---------- AUTH (docencia) ---------- */
auth:{ title:'Ingreso / Registro', grp:'Acceso', docOnly:true,
  desc:'Solo CU-01. Usuario/contraseña @ucc.edu.ar + verificación por mail. En modo anónimo no existe esta pantalla.',
  variants:[
    {name:'A · Split hero',
     notes:['Panel de marca a la izquierda, formulario a la derecha.','Deja lugar para la identidad visual de la Fase 2 sin tocar el form.','Clásico y confiable — bajo riesgo.'],
     render:m=>`<div class="app"><div class="row" style="gap:0;min-height:440px">
        <div class="col" style="background:#f4f5f7;border-right:1px solid var(--line);padding:34px;display:flex;flex-direction:column;justify-content:center">
          <span class="logo" style="font-size:22px;font-weight:700">METIS<span style="color:var(--sel)">.</span></span>
          <p class="muted" style="margin-top:14px;max-width:260px">Análisis de frecuencia de eventos extremos hidrológicos. Ingreso institucional UCC.</p>
          ${ph(140)}
        </div>
        <div class="col pad-lg" style="display:flex;flex-direction:column;justify-content:center">
          <h3 class="wf">Iniciar sesión</h3><p class="sub">Con tu cuenta @ucc.edu.ar</p>
          <div class="field"><label>Email institucional</label><div class="input">legajo@ucc.edu.ar</div></div>
          <div class="field"><label>Contraseña</label><div class="input">••••••••</div></div>
          <div class="btn pri" style="justify-content:center">Ingresar</div>
          <p class="foot-note" style="text-align:center">¿No tenés cuenta? Registrate · Verificás por mail</p>
        </div></div></div>`},
    {name:'B · Card central',
     notes:['Formulario centrado sobre fondo neutro.','Máxima simplicidad, funciona igual en mobile.','El fondo es el lienzo para el background de la Fase 2.'],
     render:m=>`<div class="app pad-lg" style="background:#f4f5f7;min-height:440px;display:flex;align-items:center;justify-content:center">
        <div class="card" style="max-width:360px;width:100%;padding:28px">
          <div style="text-align:center;margin-bottom:18px"><span class="logo" style="font-size:20px;font-weight:700">METIS<span style="color:var(--sel)">.</span></span></div>
          <div class="seg" style="width:100%;margin-bottom:16px"><span class="sel" style="flex:1;text-align:center">Ingresar</span><span style="flex:1;text-align:center">Registrarme</span></div>
          <div class="field"><label>Email @ucc.edu.ar</label><div class="input">legajo@ucc.edu.ar</div></div>
          <div class="field"><label>Contraseña</label><div class="input">••••••••</div></div>
          <div class="btn pri" style="justify-content:center;width:100%">Ingresar</div>
        </div></div>`}
  ]},

/* ---------- CONFIGURACIÓN / CARGA ---------- */
config:{ title:'Carga y configuración del análisis', grp:'Flujo principal',
  desc:'Subir CSV/Excel, mapear columnas X/Y, tipo de variable, etapas [1] o [1,2], modo (paso a paso/experto, solo docencia) y partición de Cramer. Pantalla de alta variación.',
  variants:[
    {name:'A · Wizard vertical',
     notes:['Una sección debajo de la otra, scroll natural.','Ideal para no expertos: no hay nada oculto, se lee como un checklist.','Botón de ejecutar fijo al pie.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <h3 class="wf">Nuevo análisis</h3><p class="sub">Seguí los pasos de arriba hacia abajo.</p>
        <div class="stack">
          <div class="card"><div class="card-t">1 · Archivo de datos</div><div class="dropzone"><div class="ic">⬆</div><div>Arrastrá tu CSV o Excel, o hacé clic para elegir</div></div></div>
          <div class="card"><div class="card-t">2 · Columnas</div><div class="grid2">
            <div class="field"><label>Columna X (tiempo)</label><div class="input sel">año</div></div>
            <div class="field"><label>Columna Y (variable)</label><div class="input sel">caudal_max</div></div></div></div>
          <div class="card"><div class="card-t">3 · Tipo de variable</div><div class="chips"><span class="chip sel">Caudal / Precipitación</span><span class="chip">Otro</span></div></div>
          <div class="card"><div class="card-t">4 · Etapas y modo</div>
            <div class="row"><div class="col"><label class="muted" style="font-size:12px">Etapas</label><div class="chips" style="margin-top:5px"><span class="chip sel">Etapa 1</span><span class="chip sel">Etapa 1 + 2</span></div></div>
            ${m==='doc'?`<div class="col"><label class="muted" style="font-size:12px">Modo de presentación</label><div class="seg" style="margin-top:5px"><span class="sel">Paso a paso</span><span>Experto</span></div></div>`:`<div class="col"><span class="tag-anon">modo no disponible en anónimo</span></div>`}</div></div>
        </div>
        <div class="hr"></div>
        <div class="row" style="align-items:center"><span class="muted" style="font-size:12px">Partición de Cramer: <b>default 60/30</b> · <span class="navlink">personalizar</span></span><span class="sp" style="flex:1"></span><div class="btn pri">Ejecutar análisis ▸</div></div>
        </div></div>`},
    {name:'B · Dos columnas (datos | opciones)',
     notes:['Carga + preview del archivo a la izquierda; toda la configuración a la derecha.','Aprovecha pantallas anchas de escritorio.','Ver la tabla de datos da confianza antes de correr.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <h3 class="wf">Nuevo análisis</h3><p class="sub">Cargá tus datos y ajustá las opciones.</p>
        <div class="row">
          <div class="col" style="flex:1.3">
            <div class="card"><div class="card-t">Datos cargados · serie_caudal.csv</div>
              <table class="wf"><thead><tr><th>año</th><th>caudal_max</th></tr></thead><tbody>
              <tr><td>1980</td><td>142.5</td></tr><tr><td>1981</td><td>98.1</td></tr><tr><td>1982</td><td>176.0</td></tr><tr><td>1983</td><td>121.7</td></tr><tr><td class="muted">…</td><td class="muted">40 filas</td></tr></tbody></table>
            </div>
          </div>
          <div class="col">
            <div class="card"><div class="card-t">Configuración</div>
              <div class="field"><label>Columna X (tiempo)</label><div class="input sel">año</div></div>
              <div class="field"><label>Columna Y (variable)</label><div class="input sel">caudal_max</div></div>
              <div class="field"><label>Tipo de variable</label><div class="seg"><span class="sel">Caudal/Precip.</span><span>Otro</span></div></div>
              <div class="field"><label>Etapas</label><div class="chips"><span class="chip sel">1</span><span class="chip sel">1 + 2</span></div></div>

    {name:'E · Hero de carga + acordeón',
     notes:['La carga del archivo domina la pantalla como acción primaria.','El resto de opciones se despliega en acordeón con buenos defaults.','Rápido para usuarios que confían en los valores por defecto.'],

        <div class="dropzone" style="padding:38px;margin-bottom:20px"><div class="ic" style="font-size:34px">⬆</div><div style="font-size:15px;color:var(--ink);margin-top:6px">Arrastrá tu serie (CSV o Excel)</div><div class="foot-note">o hacé clic para explorar — máx. 1 columna de tiempo + 1 de variable</div></div>

     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <div class="dropzone" style="padding:32px;margin-bottom:18px"><div class="ic" style="font-size:32px">⬆</div><div style="font-size:15px;color:var(--ink);margin-top:6px">Arrastrá tu serie (CSV o Excel)</div><div class="foot-note">o hacé clic para explorar</div></div>
        <div class="card" style="border-color:var(--sel);margin-bottom:14px"><div class="row" style="align-items:center"><div><div class="card-t" style="margin-bottom:3px">Etapas a ejecutar</div><span class="muted foot-note">Definí el alcance. Siempre visible.</span></div><span class="sp" style="flex:1"></span><div class="seg"><span class="sel">Etapa 1</span><span class="sel">Etapa 1 + 2</span></div></div></div>

        </div></div>`}

/* ---------- STREAM EN VIVO (SSE) ---------- */
stream:{ title:'Análisis en vivo (stream SSE)', grp:'Flujo principal',
  desc:'La pantalla signature. El pipeline avanza en tiempo real: contrato → descriptiva → independencia → homogeneidad → tendencia → atípicos. Chow puede pausar esperando la decisión del usuario. Alta variación.',
  variants:[
    {name:'A · Timeline vertical',
     notes:['Cada prueba es un nodo que se enciende al completarse.','La metáfora de "recorrido" transmite progreso sin ansiedad.','Los resultados se anidan bajo cada nodo — historia legible al final.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <div class="row" style="align-items:center;margin-bottom:6px"><h3 class="wf" style="font-size:15px">Ejecutando Etapa 1…</h3><span class="sp" style="flex:1"></span>${m==='doc'?`<span class="pill wait">guardando en tu historial</span>`:`<span class="pill wait">sesión efímera</span>`}</div>
        <div class="progress" style="margin-bottom:20px"><i style="width:62%"></i></div>
        <div>
          <div class="step done"><div class="node">✓</div><div style="flex:1"><b>Contrato de datos</b> <span class="pill ok">aprobado</span><div class="foot-note">40 datos · resolución anual detectada</div></div></div>
          <div class="step done"><div class="node">✓</div><div style="flex:1"><b>Estadística descriptiva</b><div class="foot-note mono">media 142.5 · S 38.1 · CV 0.267 · asimetría 0.84</div></div></div>
          <div class="step done"><div class="node">✓</div><div style="flex:1"><b>Independencia</b> <span class="pill ok">independiente</span><div class="foot-note">Anderson aprueba · Wald-Wolfowitz aprueba</div></div></div>
          <div class="step active"><div class="node">▸</div><div style="flex:1"><b>Homogeneidad</b> <span class="pill wait">calculando…</span><div class="foot-note">Helmert ✓ · t de Student ✓ · Cramer en curso</div></div></div>
          <div class="step"><div class="node">5</div><div style="flex:1;color:var(--faint)"><b>Tendencia</b> — Mann-Kendall + Kolmogorov-Smirnov</div></div>
          <div class="step" style="align-items:flex-start"><div class="node">6</div><div style="flex:1;color:var(--faint)"><b>Atípicos (Chow)</b> — puede pausar para tu decisión</div></div>
        </div></div></div>`},
    {name:'B · Barra + feed de resultados',
     notes:['Barra de progreso global arriba, tarjetas de resultado que caen debajo.','Cada prueba aparece como un item nuevo — sensación de "en vivo".','Escanear resultados es fácil; no hay que seguir un hilo.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <div class="card soft" style="margin-bottom:16px"><div class="row" style="align-items:center"><b>Etapa 1 · paso 4 de 6</b><span class="sp" style="flex:1"></span><span class="muted mono foot-note">homogeneidad · Cramer</span></div><div class="progress" style="margin-top:9px"><i style="width:66%"></i></div></div>
        <div class="stack">
          <div class="card"><div class="row"><b>Independencia — Anderson</b><span class="sp" style="flex:1"></span><span class="pill ok">aprobada</span></div><div class="foot-note mono">estadístico 0.23 · valor crítico 0.37</div></div>
          <div class="card"><div class="row"><b>Independencia — Wald-Wolfowitz</b><span class="sp" style="flex:1"></span><span class="pill ok">aprobada</span></div><div class="foot-note mono">Z 0.37 · crítico 1.96 · <span style="color:var(--warn)">n≤40: muestra chica</span></div></div>
          <div class="card"><div class="row"><b>Homogeneidad — Helmert</b><span class="sp" style="flex:1"></span><span class="pill ok">aprobada</span></div></div>
          <div class="card" style="border-color:var(--sel)"><div class="row"><b>Homogeneidad — Cramer</b><span class="sp" style="flex:1"></span><span class="pill wait">calculando…</span></div><div class="progress" style="margin-top:8px;height:5px"><i style="width:40%"></i></div></div>
        </div></div></div>`},
    {name:'C · Consola / log en vivo',
     notes:['Estilo terminal: técnico, "anti-Excel", transmite motor real corriendo.','Muy diferenciador visualmente — arriesgado para no expertos.','Podría ser una vista opcional "avanzada" del modo experto.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">
        <div class="row" style="align-items:center;margin-bottom:12px"><h3 class="wf" style="font-size:15px">Pipeline en ejecución</h3><span class="sp" style="flex:1"></span><span class="pill wait">SSE conectado</span></div>

          <div><span class="t">10:42:02</span> <span class="y">⚠ wald_wolfowitz</span> <span class="cur">Z=0.37 crit=1.96 aprobada · TEST_WARNING_SMALL_SAMPLE</span></div>
          <div><span class="t">10:42:03</span> <span class="g">✓ helmert</span> <span class="cur">|S−C|=2.1 lim=6.24 → aprobada</span></div>

        </div></div>`},
    {name:'D · Grilla de tarjetas (flip)',
     notes:['Cada prueba es una tarjeta que pasa de "pendiente" a resultado.','Panorama completo del pipeline de un vistazo.','Las agrupaciones (independencia/homogeneidad/tendencia) quedan visibles.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad-lg">

        <div class="grid2" style="margin-bottom:14px">

          <div class="kpi"><div class="row"><span class="l">Wald-Wolfowitz</span><span class="sp" style="flex:1"></span><span class="pill ok">aprobada</span></div><div class="v mono" style="font-size:15px">0.37 <span class="muted" style="font-size:11px">/ 1.96</span></div></div>
        </div>
        <div class="card-t">Homogeneidad</div>
        <div class="grid3" style="margin-bottom:14px">
          <div class="kpi"><span class="l">Helmert</span><div class="v"><span class="pill ok">ok</span></div></div>
          <div class="kpi"><span class="l">t de Student</span><div class="v"><span class="pill ok">ok</span></div></div>
          <div class="kpi" style="border-color:var(--sel)"><span class="l">Cramer</span><div class="v"><span class="pill wait">…</span></div></div>
        </div>
        <div class="card-t">Tendencia · Atípicos</div>
        <div class="grid3">
          <div class="kpi soft" style="opacity:.5"><span class="l">Mann-Kendall</span><div class="v"><span class="pill wait">en cola</span></div></div>
          <div class="kpi soft" style="opacity:.5"><span class="l">Kolmogorov-S.</span><div class="v"><span class="pill wait">en cola</span></div></div>
          <div class="kpi soft" style="opacity:.5"><span class="l">Chow</span><div class="v"><span class="pill wait">en cola</span></div></div>
        </div></div></div>`},
    {name:'E · Mapa + detalle (split)',
     notes:['Mapa del pipeline a la izquierda, detalle del paso actual a la derecha.','Bueno para modo paso a paso: la derecha muestra la fórmula sustituida.','Contexto y foco a la vez, sin perder de vista el todo.'],
     render:m=>`<div class="app">${appBar(m)}<div class="pad">
        <div class="row" style="gap:0;min-height:360px">
          <div class="col" style="flex:0 0 210px;border-right:1px solid var(--line);padding:16px 14px">
            <div class="card-t">Pipeline</div>
            <div class="stack" style="font-size:12.5px">
              <div class="row"><span class="pill ok">✓</span>&nbsp; Contrato</div>
              <div class="row"><span class="pill ok">✓</span>&nbsp; Descriptiva</div>
              <div class="row"><span class="pill ok">✓</span>&nbsp; Independencia</div>
              <div class="row" style="font-weight:700;color:var(--sel)"><span class="pill" style="background:var(--sel);color:#fff">▸</span>&nbsp; Homogeneidad</div>

              <div class="row muted"><span class="pill wait">6</span>&nbsp; Atípicos (Chow)</div>

            <div class="row" style="align-items:center"><h3 class="wf" style="font-size:15px">Homogeneidad — Cramer</h3><span class="sp" style="flex:1"></span><span class="pill wait">calculando…</span></div>
            <p class="sub">Compara submuestras (60% y 30% finales) contra la media global.</p>
            ${m==='doc'?`<div class="card soft mono" style="font-size:12px">t_w1 = √[(15·22)/(24−15·(1+0.183²))] · 0.183 = <b>1.140</b><br>t_w2 = √[(7·22)/(24−7·(1+0.352²))] · 0.352 = <b>1.088</b><br>crítico (ν=22) = 2.074</div><p class="foot-note">Modo paso a paso: se muestran fórmulas con valores sustituidos.</p>`:`<div class="grid2"><div class="kpi"><span class="l">t_w1</span><div class="v mono" style="font-size:16px">1.140</div></div><div class="kpi"><span class="l">t_w2</span><div class="v mono" style="font-size:16px">1.088</div></div></div>`}
          </div>
        </div></div></div>`},
    {name:'F · Pausa por atípico (Chow)',
     notes:['El momento crítico de interacción: el stream se pausa y pide decisión.','El pipeline NO avanza hasta aceptar/rechazar (CU-01/02).','En anónimo también pausa; en CU-03 (API) se resolvería solo — acá no aplica.'],
     render:m=>`<div class="app">${appBar(m)}<div style="position:relative">
        <div class="pad-lg" style="filter:blur(1.5px);opacity:.55">
          <div class="progress" style="margin-bottom:16px"><i style="width:92%"></i></div>
          <div class="card"><b>Atípicos — Chow (Grubbs-Beck)</b> ${graphLine(90)}</div>
        </div>
        <div class="modal-scrim" style="position:absolute;inset:0">
          <div class="modal">
            <div style="padding:18px 20px;border-bottom:1px solid var(--line)"><span class="pill warn">Decisión requerida</span><h3 class="wf" style="font-size:16px;margin-top:8px">Se detectó un dato atípico</h3></div>
            <div style="padding:18px 20px">
              <p style="margin:0 0 10px">El test de Chow marcó el valor <b class="mono">245.7</b> (año 2003) como atípico sobre los logaritmos de la serie.</p>
              <div class="banner warn"><span class="ic">!</span> METIS detecta y advierte, pero no decide por vos. Tu elección queda registrada${m==='doc'?' en el historial':''}.</div>
              <div class="row" style="margin-top:16px"><div class="btn" style="flex:1;justify-content:center">Aceptar el dato</div><div class="btn pri" style="flex:1;justify-content:center">Rechazar el dato</div></div>
            </div>
          </div>
        </div></div></div>`},
    {name:'G · Barras con contador creciente',
     notes:['Mantiene las barras de la B; arriba, índice de etapa (anillo) y pasos (puntos) con estilos distintos.','Cada test muestra un número que sube en vivo hasta clavar el estadístico calculado.','Interacción real: al entrar a esta variante corre la animación (volvé a entrar para repetirla).'],

/* ============================================================
   Motor del explorador
   ============================================================ */
const ORDER = ['auth','config','stream','resultsE1','rankingE2','designEvents','history'];
let state = { mode:'doc', screen:'config', variant:0, notes:true };

function buildNav(){
  const groups = {};
  ORDER.forEach(k=>{const s=SCREENS[k];(groups[s.grp]=groups[s.grp]||[]).push(k)});
  let html='';let idx=0;
  for(const g in groups){
    html+=`<div class="grp">${g}</div>`;
    groups[g].forEach(k=>{
      idx++;
      const s=SCREENS[k];
      const locked = s.docOnly && state.mode==='anon';
      html+=`<a data-screen="${k}" class="${k===state.screen?'active':''} ${locked?'locked':''}"><span class="n">${idx}</span>${s.title.split('(')[0].trim()}</a>`;
    });
  }
  document.getElementById('flowNav').innerHTML=html;
  document.querySelectorAll('nav.flow a').forEach(a=>a.onclick=()=>{
    const k=a.dataset.screen;
    if(SCREENS[k].docOnly && state.mode==='anon'){ state.mode='doc'; syncModeButtons(); }
    state.screen=k; state.variant=0; render();
  });
}
function syncModeButtons(){
  document.querySelectorAll('#modeToggle button').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
}
function render(){
  const s=SCREENS[state.screen];
  // pantalla docOnly en modo anónimo → mostrar estado vacío
  document.getElementById('scTitle').textContent=s.title;
  document.getElementById('scDesc').textContent=s.desc;
  // tabs
  const tabs=document.getElementById('variantTabs');
  if(s.docOnly && state.mode==='anon'){
    tabs.innerHTML='';
    document.getElementById('frame').innerHTML=`<div class="app"><div class="pad-lg" style="text-align:center;padding:60px 30px"><span class="tag-anon">no disponible en modo anónimo</span><h3 class="wf" style="margin-top:14px">Esta pantalla es exclusiva de Docencia</h3><p class="sub" style="max-width:380px;margin:8px auto 0">El modo anónimo no persiste sesiones ni historial. Cambiá a Docencia (arriba a la derecha) para verla.</p></div></div>`;
    buildNav();syncNotes();return;
  }
  tabs.innerHTML=s.variants.map((v,i)=>`<button class="${i===state.variant?'active':''}">${v.name}</button>`).join('');
  tabs.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{state.variant=i;render()});
  const v=s.variants[state.variant];
  document.getElementById('frame').innerHTML=v.render(state.mode);
  if(v.after) v.after(state.mode);
  syncNotes();
  buildNav();
}
function syncNotes(){
  const n=document.getElementById('notes');
  n.classList.toggle('hidden',!state.notes);
  const s=SCREENS[state.screen];
  if(s.docOnly && state.mode==='anon'){n.innerHTML=`<h4>Nota</h4><div class="vname">Distinción de modo</div><p>La desaparición completa de esta sección es, en sí, el marcador de que estás en modo anónimo.</p>`;return;}
  const v=s.variants[state.variant];
  n.innerHTML=`<h4>Notas de esta variante</h4><div class="vname">${v.name}</div><ul>${v.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
document.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{
  state.mode=b.dataset.mode;syncModeButtons();
  if(SCREENS[state.screen].docOnly && state.mode==='anon'){/* queda en estado vacío */}
  state.variant=0;render();
});
document.getElementById('notesBtn').onclick=()=>{state.notes=!state.notes;document.getElementById('notesBtn').classList.toggle('on',state.notes);render()};
buildNav();render();
</script>

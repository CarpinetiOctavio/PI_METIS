<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METIS · Prototipo Fase 3 — Mix & Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Chrome (neutro) ===== */
:root{--nz:#1b232b;--nz2:#28323c;--nzl:#39454f;--nzi:#e7eaed;--nzm:#9aa4ad;}
*{box-sizing:border-box}
body{margin:0;background:#0e1216;color:var(--nzi);font-family:'Inter',system-ui,sans-serif;font-size:14px}
header.exp{position:sticky;top:0;z-index:60;background:var(--nz);border-bottom:1px solid #000;padding:9px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.exp .brand{font-weight:700;letter-spacing:.4px}.exp .brand small{font-weight:400;color:var(--nzm)}
.exp .grp{display:flex;align-items:center;gap:6px}
.exp label{font-size:11px;color:var(--nzm);text-transform:uppercase;letter-spacing:.5px}
.exp select{background:var(--nz2);color:var(--nzi);border:1px solid var(--nzl);border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
.exp .sp{flex:1}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tabs button{border:1px solid var(--nzl);background:var(--nz2);color:#cfd6db;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.tabs button .sw{width:10px;height:10px;border-radius:3px}
.tabs button.on{background:var(--nzi);color:var(--nz);border-color:var(--nzi)}
.toggle{display:flex;background:var(--nz2);border-radius:16px;padding:3px;border:1px solid var(--nzl)}
.toggle button{border:0;background:transparent;color:var(--nzm);padding:4px 11px;border-radius:13px;cursor:pointer;font-size:12px;font-weight:600}
.toggle button.on{background:var(--nzi);color:var(--nz)}
.wrap{display:flex;align-items:flex-start}
.canvas{flex:1;min-width:0;padding:24px;display:flex;justify-content:center}
.device{width:100%;max-width:1000px}
#proto{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.4);position:relative}
aside.notes{width:280px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:#12171d;border-left:1px solid #232c34;padding:16px 16px 40px;font-size:12.5px;color:#aab3bb}
aside.notes h4{margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--nzm)}
aside.notes .cn{font-size:15px;font-weight:700;color:#e7eaed;margin-bottom:2px}
aside.notes .tl{color:var(--nzm);margin-bottom:12px}
aside.notes .combo{background:#0e1319;border:1px solid #232c34;border-radius:8px;padding:10px;margin-bottom:14px;line-height:1.7}
aside.notes .combo b{color:#e7eaed}
aside.notes ul{margin:6px 0 0;padding-left:15px}aside.notes li{margin-bottom:5px}
aside.notes .star{color:#e8c24a;font-weight:700}

/* ===== Componentes themeables (color por vars, forma/tipo por [data-theme]) ===== */
#proto{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.app{background:var(--bg);color:var(--ink);min-height:520px;position:relative}
.app h1,.app h2,.app h3,.h,.logo{font-family:var(--f-head)}
.mono,.num{font-family:var(--f-mono)}
.appbar{display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surf);position:relative;z-index:2}
.logo{font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.logo .mark{width:24px;height:24px;border-radius:var(--r-sm);background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.nav{color:var(--mut);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.badge.anon{background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surf2);border:1px solid var(--line)}
.pad{padding:22px 24px}.padlg{padding:28px 30px}
.h{font-size:18px;margin:0 0 3px;color:var(--ink)}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 16px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);font-weight:700;margin:0 0 10px}
.row{display:flex;gap:14px}.col{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack>*+*{margin-top:10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-md);padding:15px;position:relative}
.card.soft{background:var(--surf2)}
.ct{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin:0 0 10px}
.field{margin-bottom:11px}.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px}
.input{border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surf);height:33px;display:flex;align-items:center;padding:0 10px;color:var(--ink);font-size:12.5px}
.input.ph{color:var(--fnt)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg span{padding:6px 13px;font-size:12px;color:var(--mut);border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}.seg span.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--mut);background:var(--surf)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);padding:9px 15px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:default;font-family:var(--f-body)}
.b-pri{background:var(--acc);color:var(--on-acc)}.b-sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}.b-gho{background:transparent;color:var(--acc)}.b-sm{padding:6px 11px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:12px;font-size:10.5px;font-weight:700}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.wait{background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line-strong);font-weight:700}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
table.t tr.sel td{background:var(--acc-soft)}
.kpi{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--surf)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.kpi .v{font-size:20px;font-weight:700;color:var(--ink);font-family:var(--f-mono)}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.chart{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surf2);overflow:hidden}.chart svg{width:100%;height:100%;display:block}
.banner{border-radius:var(--r-sm);padding:10px 13px;font-size:12.5px;display:flex;gap:9px;align-items:center;border:1px solid}
.banner .ic{font-weight:800}
.banner.info{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--acc)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.dropzone{border:2px dashed var(--line-strong);border-radius:var(--r-md);background:var(--surf2);padding:24px;text-align:center;color:var(--mut)}
.dropzone .ic{font-size:28px;color:var(--fnt)}
.step{display:flex;gap:12px}.step .node{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);background:var(--surf);flex-shrink:0}
.step.done .node{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok);color:var(--ok)}
.step.active .node{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.testrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.testrow:last-child{border-bottom:0}.testrow .st{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--acc);font-size:15px}
.hr{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--mut)}.fn{font-size:11px;color:var(--fnt)}.sp{flex:1}
.tag{display:inline-block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);border:1px dashed var(--line-strong);border-radius:4px;padding:1px 6px}
.empty{padding:60px 30px;text-align:center}

/* ===== Tipografía / forma / decoración por tema ===== */
#proto[data-theme="editorial"]{--f-head:'Fraunces',Georgia,serif;--f-body:'Fraunces',Georgia,serif;--f-mono:'JetBrains Mono',monospace;--r-sm:4px;--r-md:6px}
#proto[data-theme="editorial"] .app{font-optical-sizing:auto}
#proto[data-theme="editorial"] .sub,#proto[data-theme="editorial"] .fn,#proto[data-theme="editorial"] .nav,#proto[data-theme="editorial"] td,#proto[data-theme="editorial"] .field label{font-weight:400}
#proto[data-theme="editorial"] .app{background:repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--line) 45%,transparent) 27px 28px),var(--bg)}
#proto[data-theme="editorial"] .eyebrow{border-left:3px solid var(--acc);padding-left:9px}
#proto[data-theme="editorial"] .kpi .v{font-family:var(--f-head);font-weight:600;font-size:23px}
#proto[data-theme="editorial"][data-mode="dark"] .card{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc2) 14%,transparent)}

#proto[data-theme="agua"]{--f-head:'Space Grotesk',sans-serif;--f-body:'Manrope',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:10px;--r-md:16px}
#proto[data-theme="agua"] .app{position:relative;background:
  linear-gradient(180deg, color-mix(in srgb,var(--acc) 6%,transparent), transparent 42%),
  radial-gradient(120% 80% at 100% 0%, var(--acc-soft), transparent 55%),
  radial-gradient(90% 90% at 0% 100%, color-mix(in srgb,var(--acc2) 12%,transparent), transparent 60%),
  var(--bg);}
#proto[data-theme="agua"] .app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.28;background:radial-gradient(55% 40% at 25% 30%,color-mix(in srgb,var(--acc2) 34%,transparent),transparent 70%);animation:drift 15s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(-9%,-7%) scale(1)}100%{transform:translate(11%,9%) scale(1.14)}}
#proto[data-theme="agua"] .appbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);opacity:.7}
#proto[data-theme="agua"] .b-pri{background:linear-gradient(120deg,var(--acc),var(--acc2));border:0}
#proto[data-theme="agua"] .prog i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
#proto[data-theme="agua"] .card{box-shadow:0 10px 30px -20px color-mix(in srgb,var(--acc) 50%,transparent)}
#proto[data-theme="agua"][data-mode="dark"] .app::after{opacity:.40}
#proto[data-theme="agua"][data-mode="dark"] .card{box-shadow:0 12px 34px -20px #000,inset 0 1px 0 color-mix(in srgb,var(--acc) 22%,transparent)}

#proto[data-theme="academico"]{--f-head:'IBM Plex Sans',sans-serif;--f-body:'IBM Plex Sans',sans-serif;--f-mono:'JetBrains Mono',monospace;--r-sm:8px;--r-md:12px}
#proto[data-theme="academico"] .app{background:
  radial-gradient(120% 70% at 100% -10%, var(--acc-soft), transparent 55%),
  radial-gradient(closest-side at 8px 8px, color-mix(in srgb,var(--line-strong) 40%,transparent) 1px, transparent 1.6px) 0 0/24px 24px,
  var(--bg);}
#proto[data-theme="academico"] .eyebrow{display:inline-flex;align-items:center;gap:8px}
#proto[data-theme="academico"] .eyebrow::before{content:'';width:16px;height:2px;background:var(--acc)}
#proto[data-theme="academico"] .card{box-shadow:0 8px 22px -16px color-mix(in srgb,var(--ink) 45%,transparent);border-left:3px solid color-mix(in srgb,var(--acc) 55%,var(--line))}
#proto[data-theme="academico"] .pad>*,#proto[data-theme="academico"] .padlg>*{animation:afade .5s both}
@keyframes afade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#proto[data-theme="academico"][data-mode="dark"] .card{box-shadow:0 10px 26px -16px #000,inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent);border-left-color:color-mix(in srgb,var(--acc) 50%,var(--line))}

#proto[data-theme="instrumento"]{--f-head:'JetBrains Mono',monospace;--f-body:'JetBrains Mono',monospace;--f-mono:'JetBrains Mono',monospace;--r-sm:3px;--r-md:4px}
#proto[data-theme="instrumento"] .sub,#proto[data-theme="instrumento"] .fn,#proto[data-theme="instrumento"] p{font-size:12px;letter-spacing:-.2px}
#proto[data-theme="instrumento"] .app{background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-color:var(--bg)}
#proto[data-theme="instrumento"] .eyebrow::before{content:'▸ '}
#proto[data-theme="instrumento"] .card::before,#proto[data-theme="instrumento"] .card::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--acc);opacity:.65}
#proto[data-theme="instrumento"] .card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
#proto[data-theme="instrumento"] .card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#proto[data-theme="instrumento"] .b-pri{box-shadow:0 0 0 1px var(--acc),0 0 16px -5px color-mix(in srgb,var(--acc) 70%,transparent)}
#proto[data-theme="instrumento"] .badge::before{animation:ipulse 1.6s ease-in-out infinite}
@keyframes ipulse{0%,100%{opacity:1}50%{opacity:.45}}
#proto[data-theme="instrumento"][data-mode="dark"] .app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.06) 2px 3px)}
#proto[data-theme="instrumento"][data-mode="dark"] .kpi .v,#proto[data-theme="instrumento"][data-mode="dark"] .testrow .st{text-shadow:0 0 13px color-mix(in srgb,var(--acc) 55%,transparent)}
</style>
</head>
<body>
<!--
  METIS · Prototipo Fase 3 — Mix & Match
  Combina wireframes (Fase 1) + identidad (Fase 2). Por pantalla: la variante ELEGIDA (★) + hasta 2 alternativas.
  Ejes: pantalla × variante × tema (4) × claro/oscuro × docencia/anónimo.
  Doc: metis-prototipo-fase3.md · Decisiones de wireframe: metis-wireframes-fase1-decisiones.md
  v1: Mix & Match inicial (8 pantallas × 4 temas × claro/oscuro × docencia/anónimo). Snapshot en /versiones/.
  v2 (20/07): tipografía propia por tema en TODA la página (no solo títulos) — Editorial=Fraunces,
     Hidrología=Space Grotesk(títulos)+Manrope(cuerpo), Académico=IBM Plex Sans, Instrumento=JetBrains Mono.
     Hidrología suma fondo con caustic animado (drift) + washes de profundidad; Académico suma wash de
     acento, borde-acento en tarjetas y aparición fade-up.
-->
<header class="exp">
  <div class="brand">METIS <small>· Prototipo Fase 3 — Mix &amp; Match · v2</small></div>
  <div class="sp"></div>
  <div class="grp"><label>Pantalla</label><select id="selScreen"></select></div>
  <div class="grp"><label>Variante</label><div class="tabs" id="varTabs"></div></div>
  <div class="grp"><label>Tema</label><div class="tabs" id="themeTabs"></div></div>
  <div class="toggle" id="modeToggle"><button data-mode="light" class="on">Claro</button><button data-mode="dark">Oscuro</button></div>
  <div class="toggle" id="cuToggle"><button data-cu="doc" class="on">Docencia</button><button data-cu="anon">Anónimo</button></div>
</header>
<div class="wrap">
  <div class="canvas"><div class="device"><div id="proto" data-theme="agua" data-mode="light"></div></div></div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ===== Temas (tokens claro/oscuro, enriquecidos en Fase 2) ===== */
const THEMES={
 editorial:{name:'Editorial',sw:'#8A2B3A',
   light:{bg:'#FBF9F4',surf:'#FFFFFF',surf2:'#F0ECE3',ink:'#1A1712',mut:'#6B655B',fnt:'#A69F92',line:'#E7E1D5',lineStrong:'#D2C9B8',acc:'#8A2B3A',accSoft:'#F2DCDF',onAcc:'#FFFFFF',acc2:'#9A6B1E',ok:'#3F6B52',warn:'#9A7B2E',crit:'#A33A3A'},
   dark:{bg:'#15110D',surf:'#1E1913',surf2:'#271F16',ink:'#F4EFE4',mut:'#B4AA97',fnt:'#79705F',line:'#33291D',lineStrong:'#4A3D28',acc:'#E4949C',accSoft:'#3A2822',onAcc:'#15110D',acc2:'#CBA25E',ok:'#84B693',warn:'#D9B96C',crit:'#E88C8C'}},
 agua:{name:'Hidrología',sw:'#0E7C93',
   light:{bg:'#F1F8FB',surf:'#FFFFFF',surf2:'#E4F0F5',ink:'#0F2830',mut:'#4C6672',fnt:'#9BB2BB',line:'#D0E2E9',lineStrong:'#B4D2DD',acc:'#0E7C93',accSoft:'#D3EDF3',onAcc:'#FFFFFF',acc2:'#3BB6CE',ok:'#2E8B7A',warn:'#B9852E',crit:'#C2503F'},
   dark:{bg:'#03141A',surf:'#0B2732',surf2:'#103744',ink:'#E2F4F9',mut:'#7FA3AE',fnt:'#4C6C77',line:'#1B4350',lineStrong:'#2A5A68',acc:'#3FD3EA',accSoft:'#0C3441',onAcc:'#03141A',acc2:'#7CE9F5',ok:'#4FC7A8',warn:'#D9B064',crit:'#E8776A'}},
 academico:{name:'Académico',sw:'#35618E',
   light:{bg:'#F4F7FA',surf:'#FFFFFF',surf2:'#E9EFF4',ink:'#1E262D',mut:'#5F6C77',fnt:'#9EA9B3',line:'#DDE4EB',lineStrong:'#C6D0DA',acc:'#2F6191',accSoft:'#DBE8F4',onAcc:'#FFFFFF',acc2:'#2C8A6E',ok:'#2E7D5B',warn:'#9A7A2E',crit:'#B0453F'},
   dark:{bg:'#0F141B',surf:'#161D27',surf2:'#1D2632',ink:'#E9EFF5',mut:'#8B99A7',fnt:'#54606D',line:'#273240',lineStrong:'#3A4859',acc:'#72A6E2',accSoft:'#152538',onAcc:'#0F141B',acc2:'#5FC4A4',ok:'#5BB98C',warn:'#CBAB60',crit:'#DB7A72'}},
 instrumento:{name:'Instrumento',sw:'#0E7490',
   light:{bg:'#F3F6F8',surf:'#FFFFFF',surf2:'#E9EEF2',ink:'#0B0E12',mut:'#5B6672',fnt:'#9AA5B1',line:'#DEE5EB',lineStrong:'#C6D0D8',acc:'#0E7490',accSoft:'#D4EEF3',onAcc:'#FFFFFF',acc2:'#4D7C0F',ok:'#128A4E',warn:'#B5791A',crit:'#C24444'},
   dark:{bg:'#090C10',surf:'#12171F',surf2:'#191F29',ink:'#E6EDF3',mut:'#8A97A6',fnt:'#566270',line:'#212A36',lineStrong:'#33404E',acc:'#22D3EE',accSoft:'#0C2A33',onAcc:'#04252B',acc2:'#C6F84E',ok:'#35D07A',warn:'#F4B740',crit:'#FF6A6A'}}
};
const THEME_ORDER=['editorial','agua','academico','instrumento'];

/* ===== Helpers de markup themeable ===== */
const bar=cu=>`<div class="appbar"><span class="logo"><span class="mark">M</span>METIS</span><span class="sp"></span><span class="nav">Nuevo análisis</span>${cu==='doc'?'<span class="nav">Historial</span>':''}<span class="sp"></span><span class="badge ${cu==='doc'?'':'anon'}">${cu==='doc'?'Docencia':'Anónimo · solo resultados'}</span>${cu==='doc'?'<span class="avatar"></span>':''}</div>`;
const chA=(h=130)=>`<div class="chart" style="height:${h}px"><svg viewBox="0 0 320 130" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".30"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs><path d="M0,104 30,82 60,92 90,52 120,68 150,34 180,58 210,26 240,46 270,20 300,38 320,30 L320,130 0,130Z" fill="url(#ga)"/><path d="M0,104 30,82 60,92 90,52 120,68 150,34 180,58 210,26 240,46 270,20 300,38 320,30" fill="none" stroke="var(--acc)" stroke-width="2"/></svg></div>`;
const chL=(h=120)=>`<div class="chart" style="height:${h}px"><svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="0,95 40,70 80,82 120,45 160,60 200,30 240,52 300,20" fill="none" stroke="var(--acc)" stroke-width="2"/></svg></div>`;
const chBars=(n=10,h=120)=>{let b='';for(let i=0;i<n;i++){const y=20+Math.round(Math.abs(Math.sin(i*1.3))*62);b+=`<rect x="${8+i*(300/n)}" y="${120-y}" width="${300/n-6}" height="${y}" fill="var(--acc)" opacity="0.35"/>`}return`<div class="chart" style="height:${h}px"><svg viewBox="0 0 300 120" preserveAspectRatio="none">${b}</svg></div>`};
const yt=()=>`<span class="seg" style="font-size:10.5px"><span class="on">Calendario</span><span>Hidrológico</span></span>`;
const anonResults=()=>`<div class="app">${bar('anon')}<div class="padlg"><div class="banner info" style="margin-bottom:14px"><span class="ic">i</span> Modo anónimo = UI Experto: <b>&nbsp;solo resultados</b>, sin desarrollo paso a paso, sin exportar.</div><h3 class="h">Homogeneidad — Helmert</h3><div class="grid3" style="margin-top:12px"><div class="kpi"><div class="l">|S−C|</div><div class="v">3</div></div><div class="kpi"><div class="l">límite</div><div class="v">6.24</div></div><div class="kpi"><div class="l">veredicto</div><div class="v" style="font-size:13px"><span class="pill ok">aprobada</span></div></div></div></div></div>`;

};
const ORDER=['auth','config','stream','resultsE1','pasoapaso','rankingE2','designEvents','history'];
let state={screen:'config',variant:0,theme:'agua',mode:'light',cu:'doc'};

function applyVars(){
 const c=THEMES[state.theme][state.mode],p=document.getElementById('proto');
 p.setAttribute('data-theme',state.theme);p.setAttribute('data-mode',state.mode);
 const S=(k,v)=>p.style.setProperty(k,v);
 S('--bg',c.bg);S('--surf',c.surf);S('--surf2',c.surf2);S('--ink',c.ink);S('--mut',c.mut);S('--fnt',c.fnt);
 S('--line',c.line);S('--line-strong',c.lineStrong);S('--acc',c.acc);S('--acc-soft',c.accSoft);S('--on-acc',c.onAcc);
 S('--acc2',c.acc2);S('--ok',c.ok);S('--warn',c.warn);S('--crit',c.crit);
}
function render(){
 applyVars();
 const s=SCREENS[state.screen],v=s.variants[state.variant],p=document.getElementById('proto');
 if(s.docOnly && state.cu==='anon'){
   p.innerHTML=`<div class="app"><div class="empty"><span class="tag">no disponible en anónimo</span><h3 class="h" style="margin-top:12px">Historial exclusivo de Docencia</h3><p class="sub" style="max-width:360px;margin:8px auto 0">El modo anónimo no persiste sesiones. Cambiá a Docencia para verlo.</p></div></div>`;
 } else {
   p.innerHTML=v.r(state.cu);
 }
 animate();buildControls();notes();
}
function animate(){
 const p=document.getElementById('proto');
 p.querySelectorAll('[data-count]').forEach((e,i)=>{const t=parseFloat(e.dataset.target),d=1000+i*130,st=performance.now()+i*130;
   (function tick(now){let x=(now-st)/d;if(x<0)x=0;if(x>1)x=1;const k=1-Math.pow(1-x,3);e.textContent=(t*k).toFixed(2);if(x<1)requestAnimationFrame(tick)})(performance.now());});
 p.querySelectorAll('[data-fill]').forEach((b,i)=>{b.style.width='0';setTimeout(()=>b.style.width=(60+i*4)+'%',70+i*90);});
}
function buildControls(){
 const sel=document.getElementById('selScreen');
 sel.innerHTML=ORDER.map(k=>`<option value="${k}" ${k===state.screen?'selected':''}>${SCREENS[k].title}</option>`).join('');
 sel.onchange=()=>{state.screen=sel.value;state.variant=0;render();};
 document.getElementById('varTabs').innerHTML=SCREENS[state.screen].variants.map((v,i)=>`<button class="${i===state.variant?'on':''}">${v.n}</button>`).join('');
 document.querySelectorAll('#varTabs button').forEach((b,i)=>b.onclick=()=>{state.variant=i;render();});
 document.getElementById('themeTabs').innerHTML=THEME_ORDER.map(k=>`<button class="${k===state.theme?'on':''}"><span class="sw" style="background:${THEMES[k].sw}"></span>${THEMES[k].name}</button>`).join('');
 document.querySelectorAll('#themeTabs button').forEach((b,i)=>b.onclick=()=>{state.theme=THEME_ORDER[i];render();});
}
function notes(){
 const s=SCREENS[state.screen],v=s.variants[state.variant];
 const nm=v.n.replace('★','<span class="star">★</span>');
 document.getElementById('notes').innerHTML=`<h4>Combinación actual</h4><div class="combo"><b>Pantalla:</b> ${s.title}<br><b>Variante:</b> ${nm}<br><b>Tema:</b> ${THEMES[state.theme].name} · ${state.mode==='light'?'claro':'oscuro'}<br><b>Modo:</b> ${state.cu==='doc'?'Docencia':'Anónimo'}</div><h4>Sobre esta variante</h4><ul><li>${v.note}</li></ul><h4>Mix &amp; Match</h4><ul><li>Cambiá cualquiera de los 5 ejes arriba y todo se re-renderiza al toque.</li><li>La ★ marca la variante elegida en Fase 1.</li><li>Justificaciones: <span style="color:#c6cdd4">metis-prototipo-fase3.md</span>.</li></ul>`;
}
document.querySelectorAll('#modeToggle button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x.dataset.mode===state.mode));render();});
document.querySelectorAll('#cuToggle button').forEach(b=>b.onclick=()=>{state.cu=b.dataset.cu;document.querySelectorAll('#cuToggle button').forEach(x=>x.classList.toggle('on',x.dataset.cu===state.cu));render();});
render();
</script>
</body>
</html>

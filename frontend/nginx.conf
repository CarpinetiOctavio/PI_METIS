server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # F9 (docs/frontend/informe-diagnostico-ui-rota.md): el router usa
    # createBrowserRouter (rutas reales del navegador, no hash-routing) —
    # sin este fallback, recargar la página en cualquier ruta que no sea "/"
    # (ej. /config, /history/abc) le pide a nginx un archivo que no existe
    # y devuelve 404 en vez de servir la SPA para que React Router resuelva
    # la ruta del lado del cliente.
    location / {
        try_files $uri /index.html;
    }
}

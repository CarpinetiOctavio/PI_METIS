server {
    listen 3000;
    server_tokens off;

    # DECISIÓN 050 — igualado con nginx/nginx.conf. Este servicio no proxea
    # /api/ en la topología actual (solo sirve el build estático), pero se
    # mantiene el mismo límite por si se expone alguna vez standalone.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # F9 (docs/historico/planes/frontend/informe-diagnostico-ui-rota.md): el router usa
    # createBrowserRouter (rutas reales del navegador, no hash-routing) —
    # sin este fallback, recargar la página en cualquier ruta que no sea "/"
    # (ej. /config, /history/abc) le pide a nginx un archivo que no existe
    # y devuelve 404 en vez de servir la SPA para que React Router resuelva
    # la ruta del lado del cliente.
    location / {
        try_files $uri /index.html;
        # index.html (y el fallback de la SPA) se revalida siempre: es el que
        # apunta a los assets con hash del build nuevo después de un redespliegue.
        add_header Cache-Control "no-cache";
    }

    # H11 (plan de mejoras post-despliegue UCC, 29/10/2026) — Vite pone un hash
    # del contenido en el nombre de cada archivo de /assets/: un nombre nunca
    # cambia de contenido, así que se cachea un año sin revalidar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

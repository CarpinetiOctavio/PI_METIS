name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-
      - run: pip install ruff==0.4.4
      - run: ruff check metis/
        working-directory: backend
      - run: ruff format --check metis/
        working-directory: backend

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -m "unit or integration" --tb=short
          EXIT=$?
          [ $EXIT -eq 0 ] || [ $EXIT -eq 5 ] && exit 0 || exit $EXIT

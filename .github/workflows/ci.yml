name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-
      - run: pip install ruff==0.15.12
      - run: ruff check metis/
        working-directory: backend
      - run: ruff format --check metis/
        working-directory: backend

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Integración contra servicios reales (B3/B4 del plan del TP de Calidad): PostgreSQL con
    # las migraciones aplicadas y Mailpit como servidor SMTP de captura (DECISIÓN 049).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metis -d metis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.20.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql+asyncpg://metis:metis@localhost:5432/metis_test
      JWT_SECRET_KEY: clave-de-ci-sin-valor-real
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: metis
      SMTP_PASSWORD: metis
      SMTP_FROM_ADDRESS: metis-noreply@ucc.edu.ar
      SMTP_STARTTLS: "false"
      MAILPIT_URL: http://localhost:8025
      # Con servicios caídos los tests de BD/SMTP fallan en vez de saltearse.
      METIS_REQUIRE_DB: "1"
      METIS_REQUIRE_MAILPIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
        working-directory: backend
      # Paso explícito: nada en la app aplica las migraciones al arrancar (incidente del 05/08/2026).
      - run: alembic upgrade head
        working-directory: backend
      # Cobertura de sentencia y de decisión (--cov-branch) — DECISIÓN 077.
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -m "unit or integration" --tb=short \
            --cov=metis --cov-branch \
            --cov-report=term --cov-report=xml --cov-report=html \
            --junitxml=junit-backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-backend
          path: |
            backend/coverage.xml
            backend/junit-backend.xml
            backend/htmlcov/
          retention-days: 30

  error-catalog:
    name: Catálogo de códigos de error (DECISIÓN 038)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/check-error-catalog.sh

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit-frontend.xml
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-frontend
          path: |
            frontend/coverage/
            frontend/junit-frontend.xml
          retention-days: 30
      - run: npm run build
        working-directory: frontend

  # Despliegue efímero (B5/B6 del plan del TP de Calidad): el stack completo con la configuración de
  # producción (docker-compose.ci.yml) dentro del runner, el mismo procedimiento que la demo local
  # (scripts/deploy-local.sh). Smoke en cada corrida; E2E con Playwright (DECISIÓN 046) en cada PR.
  despliegue:
    name: Despliegue efímero (smoke + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_BASE_URL: http://localhost
      E2E_BASE_URL: http://localhost
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      # El smoke corre desde el runner, contra nginx, como un cliente cualquiera.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --only-binary :all: httpx==0.27.0 pytest==8.2.0 pytest-asyncio==0.23.6
      - name: Desplegar y correr el smoke
        run: bash scripts/deploy-local.sh
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        if: github.event_name == 'pull_request'
        working-directory: frontend
      # El binario del lockfile (@playwright/test exacta), no npx: no baja nada fuera de package-lock.json.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
        working-directory: frontend
      - name: E2E (Playwright)
        if: github.event_name == 'pull_request'
        run: bash scripts/test.sh e2e
      - name: Logs del despliegue
        if: failure()
        run: docker compose -p metis-ci -f docker-compose.yml -f docker-compose.ci.yml logs --tail 200
      # Siempre, no solo al fallar: el reporte en verde es evidencia del TP y de la Capa 4 de testing.md.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: reporte-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

  # Gate propio, independiente de SonarCloud (DECISIÓN 077): cobertura del código nuevo
  # ≥ 80 % (diff-cover, solo en PR) y duplicación ≤ 5 % (jscpd). Resume todo en el job.
  quality-gate:
    name: Quality gate (cobertura nueva, duplicación)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: reporte-backend
          path: reportes/backend
      - uses: actions/download-artifact@v4
        with:
          name: reporte-frontend
          path: reportes/frontend
      # jscpd viene fijado en frontend/package-lock.json: npm ci --ignore-scripts no corre
      # scripts de instalación y no se baja nada fuera del lockfile.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Duplicación (jscpd)
        id: jscpd
        continue-on-error: true
        run: frontend/node_modules/.bin/jscpd --output reportes/jscpd backend/metis frontend/src
      - name: Cobertura del código nuevo (diff-cover)
        id: diffcover
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pip install --only-binary :all: diff-cover==9.2.0
          # coverage.xml trae <source> absoluto del job test (mismo path en este runner).
          # El lcov de Vitest trae SF relativo a frontend/: se reescribe a la raíz del repo.
          sed -E 's#^SF:src/#SF:frontend/src/#' reportes/frontend/coverage/lcov.info > reportes/frontend/lcov-repo.info
          BASE="origin/${{ github.base_ref }}"
          set +e
          diff-cover reportes/backend/coverage.xml --compare-branch="$BASE" \
            --fail-under=80 --markdown-report reportes/diff-cover-backend.md
          B=$?
          diff-cover reportes/frontend/lcov-repo.info --compare-branch="$BASE" \
            --fail-under=80 --markdown-report reportes/diff-cover-frontend.md
          F=$?
          set -e
          [ $B -eq 0 ] && [ $F -eq 0 ]
      - name: Resumen
        if: always()
        run: |
          python scripts/ci_resumen.py >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci_resumen.py --json > reportes/metricas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-calidad
          path: |
            reportes/metricas.json
            reportes/jscpd/
            reportes/diff-cover-*.md
          retention-days: 90
      - name: Resultado del gate
        if: always()
        run: |
          echo "tests backend: ${{ needs.test.result }} | tests frontend: ${{ needs.frontend.result }}"
          echo "duplicación: ${{ steps.jscpd.outcome }} | cobertura nueva: ${{ steps.diffcover.outcome }}"
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.frontend.result }}" = "success" ]
          [ "${{ steps.jscpd.outcome }}" = "success" ]
          [ "${{ steps.diffcover.outcome }}" != "failure" ]

services:
  backend:
    build: ./backend
    command: uvicorn metis.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    env_file: .env
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "3000"

  postgres:
    image: postgres:15
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"

  # Servidor SMTP de captura (DECISIÓN 049): recibe los mails de verificación sin mandarlos
  # afuera. Interfaz web y API en http://localhost:8025. El backend lo usa solo si el .env
  # apunta a él (ver .env.example, "Desarrollo sin relay real").
  mailpit:
    image: axllent/mailpit:v1.20.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    expose:
      - "1025"
    ports:
      - "8025:8025"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:

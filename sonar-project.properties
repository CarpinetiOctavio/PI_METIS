# Configuración del análisis de SonarCloud por CI (job `sonarcloud` de ci.yml, B13 — DECISIÓN 077).
# Desde B13 el Análisis Automático está desactivado: este archivo es la única configuración que lee Sonar
# (.sonarcloud.properties, que solo leía el automático, se borró — ver addendum del 02/10/2026 a DECISIÓN 044).
sonar.projectKey=Kevinmass_PI_METIS
sonar.organization=kevinmass

sonar.sources=backend/metis,frontend/src
sonar.tests=backend/tests,frontend/src
# frontend/src tiene producción y tests mezclados: un archivo no puede indexarse como fuente y como test a la
# vez, así que los tests se sacan de las fuentes y se incluyen en los tests con los mismos patrones.
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Artefactos generados por herramientas y prototipos de diseño — no son código nuestro.
# mockServiceWorker.js lo genera `npx msw init` (ver DECISIÓN 042).
sonar.exclusions=frontend/public/mockServiceWorker.js,frontend/dist/**,frontend/frontend-design/**,\
  frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Cobertura de los dos lados, generada por los jobs test y frontend (rutas del job sonarcloud).
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reportes/backend/coverage.xml
sonar.javascript.lcov.reportPaths=reportes/frontend/lcov-repo.info
# Mismo criterio que vite.config.ts: main.tsx y los .d.ts no cuentan para cobertura.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/**/*.d.ts

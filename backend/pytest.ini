[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    # DECISIÓN 033 — python-multipart 0.0.28 deprecó `import multipart`;
    # la versión de Starlette que trae fastapi==0.111.0 todavía lo usa
    # internamente. Bump de FastAPI/Starlette diferido a criterios
    # explícitos (ver docs/decisiones/decision033.md), no es un fix
    # disponible hoy sin ampliar el alcance de esta sesión.
    ignore::PendingDeprecationWarning:starlette.formparsers
markers =
    unit: tests unitarios del core (sin BD, sin HTTP)
    integration: tests de integración (con BD de test)
    e2e: tests end-to-end
    regression: tests de regresión matemática contra tesis de Facundo
